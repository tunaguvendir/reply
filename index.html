const seen=new Set(),pending=new Map();
const reduced=matchMedia("(prefers-reduced-motion:reduce)").matches;
function aiBlock(key,text,cls="",extra=""){
  return `<div class="ai ${cls}"><div class="ai-label">AI Assistant (simulated)</div><div class="ai-text" data-ai="${esc(key)}" data-raw="${esc(text)}">${fmt(text)}</div><div class="ai-extra">${extra}</div></div>`;
}
function animate(el,key){
  const isField=el.tagName==="TEXTAREA";
  const text=isField?el.value:(el.dataset.raw||el.textContent);
  const extra=el.parentElement.querySelector(":scope > .ai-extra");
  const set=v=>{if(isField)el.value=v;else el.textContent=v};
  if(extra)extra.style.display="none";
  const scrollChat=()=>{const c=el.closest(".chat");if(c)c.scrollTop=c.scrollHeight};
  const reveal=()=>{if(el.closest("#panel"))el.closest(".ai").scrollIntoView({behavior:reduced?"auto":"smooth",block:"nearest"})};
  const p=(async()=>{
    if(isField){el.readOnly=true;el.value="";el.placeholder="AI Assistant (simulated) is drafting…"}
    else el.innerHTML=`<span class="thinking">Thinking<i>.</i><i>.</i><i>.</i></span>`;
    scrollChat();reveal();
    await sleep(600+Math.random()*600);
    if(!el.isConnected)return;
    if(!reduced){
      const step=Math.max(2,Math.ceil(text.length/95));
      for(let i=step;i<text.length;i+=step){
        set(text.slice(0,i));scrollChat();
        await sleep(16);
        if(!el.isConnected)return;
      }
    }
    if(isField||!el.dataset.raw)set(text);else el.innerHTML=fmt(text);
    if(extra)extra.style.display="";
    scrollChat();reveal();
  })().finally(()=>{
    pending.delete(key);
    const box=document.querySelector(`[data-draft-key="${key}"]`);
    if(box){box.readOnly=false;const b=document.getElementById(box.dataset.approve);if(b)b.disabled=false}
  });
  pending.set(key,p);
  return p;
}
function runAi(){document.querySelectorAll("[data-ai]").forEach(el=>{const k=el.dataset.ai;if(seen.has(k))return;seen.add(k);animate(el,k)})}

async function tbSend(text){
  const cid=S.course,tb=S.tb[cid],cfg=SCRIPTED_AI.teachback[cid];
  if(!text.trim()||tb.done||tb.busy)return;
  const token=tb.token;
  tb.busy=true;
  tb.msgs.push({who:"me",text});tb.turn++;
  const keys=Object.keys(cfg.concepts),fresh=keys.filter(k=>!tb.hits[k]&&cfg.concepts[k].re.test(text));
  fresh.forEach(k=>tb.hits[k]=true);
  const wrongNow=cfg.wrongRe.test(text);if(wrongNow)tb.wrong=true;
  const firstMissing=keys.find(k=>!tb.hits[k]);
  let reply,finish=false;
  if(wrongNow)reply=cfg.wrongReply;
  else if(!firstMissing){reply=cfg.allDone;finish=true}
  else if(fresh.length)reply=cfg.concepts[fresh[fresh.length-1]].ack+" "+cfg.concepts[firstMissing].ask;
  else reply=cfg.generic[Math.min(tb.gen++,cfg.generic.length-1)];
  if(tb.turn>=4)finish=true;
  const key=`tb-${cid}-${Date.now()}-${tb.turn}`;
  tb.msgs.push({who:"ai",text:reply,key});
  renderModal();runAi();
  await (pending.get(key)||Promise.resolve());
  if(tb.token!==token)return;
  tb.busy=false;
  if(finish){await sleep(450);if(tb.token!==token)return;tb.done=true;tb.auto=false;logEvent(`Teach-back finished on "${cfg.topic}"`)}
  if(S.modal)renderModal();
}
async function tbAuto(){
  const cid=S.course,tb=S.tb[cid],cfg=SCRIPTED_AI.teachback[cid];
  /* Always restart the scripted path from a clean chat so it cannot fail */
  const fresh=newTb(cid);fresh.auto=true;fresh.token=tb.token+1;S.tb[cid]=fresh;
  seen.add(fresh.msgs[0].key);
  const token=fresh.token;
  renderModal();
  for(const line of cfg.perfect){
    await sleep(700);
    if(fresh.token!==token||!S.modal)return;
    await tbSend(line);
    if(fresh.token!==token||!S.modal)return;
  }
}

function heatColor(score){
  const stops=[[47,111,222],[138,143,168],[242,140,40]],x=Math.min(score,80)/80*2,i=Math.min(Math.floor(x),1),f=x-i;
  const rgb=stops[i].map((v,k)=>Math.round(v+(stops[i+1][k]-v)*f));
  const lum=(.2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2])/255;
  return{bg:`rgb(${rgb.join(",")})`,fg:lum>.5?"#0f1012":"#ffffff"};
}

  </section>
  <section class="card s6"><h2>Needs attention</h2><p class="source">${risk.length} anonymous students, grouped by reason.</p>
    ${Object.entries(d.riskGroups).sort((a,b)=>b[1]-a[1]).map(([k,n])=>{const key="risk:"+k,on=S.notified.has(key);return `<div class="citem"><span><b>${n}</b> · ${esc(k)}</span><button class="btn small" data-a="notify-group" data-v="${esc(k)}" ${on?"disabled":""}>${on?"TA notified":"Notify TA"}</button></div>`}).join("")}
  </section>
  <section class="card s6"><div class="eyebrow">Weekly digest</div>
    ${aiBlock("digest-physics",digestText,"c4").replace('class="ai-text"','class="ai-text digest"')}
    <div class="action"><b>Recommended action:</b> ${esc(digest.action)}</div>
    <div style="margin-top:10px"><button class="btn" data-a="digest-notice">Turn into a notice</button></div>
  </section>
  <section class="card s12"><h2>Average learning time per level</h2>
    ${stats.map(s=>`<div class="tr" title="${esc(s.topic.name)}: ${s.avgMin} minutes on average"><span>${s.topic.level}. ${esc(shortName(s.topic))}</span><i style="width:${Math.round(s.avgMin/maxMin*100)}%"></i><span class="muted">${s.avgMin} min</span></div>`).join("")}
    <div class="hard"><b>Most difficult part:</b> ${esc(ranked[0].topic.name)}, "${esc(topCluster.name.toLowerCase())}"</div>
  </section>
  ${S.events.length?`<section class="card events"><div class="eyebrow">Live from this demo session: the student assistant is the data source</div><ul>${S.events.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></section>`:""}
  </div>`;
}
function strugglePage(){
  const sel=topicStats("physics",S.teacherTopic.physics),t=sel.topic;
  const hot=sel.hard.filter(x=>x.count).sort((a,b)=>b.count-a.count),cold=sel.hard.filter(x=>!x.count);
  return `<div class="teacher ${S.fadeIn?"fade":""}" data-keep="struggle">
  ${teacherHead("Where the class is struggling","Physics I · Tap a level to see where difficulty piles up inside it.")}
  <section class="card s12"><div class="row" style="justify-content:flex-end"><div class="legend" style="margin:0;min-width:300px"><span>Low</span><i></i><span>High (80%+)</span></div></div>
    <div class="map">${teacherMap()}</div></section>
  <section class="card s7" id="density">
    <div class="eyebrow">Level ${t.level}</div><h2 style="font-size:21px">${esc(t.name)}</h2>
    <div class="stat"><span><b>${sel.stuck}</b> of <b>${sel.reached}</b> struggled</span><span><b>${sel.fullHint}</b> used the full solution</span></div>
    <h3 class="dh">Where difficulty piles up</h3>
    ${hot.map((x,i)=>{const c=heatColor(x.pct/hot[0].pct*80);return `<div class="drow" title="${x.count} of ${sel.stuck} struggling students"><span class="dname">${esc(x.name)}${x.group?`<small>${esc(x.group)}</small>`:""}</span><span class="dbar"><i style="width:${Math.max(x.pct,3)}%;background:${c.bg}"></i></span><span class="dval"><b>${x.pct}%</b> ${x.count} students</span></div>`}).join("")}
    <p class="source" style="margin-top:8px">Share of the ${sel.stuck} struggling students who had trouble with each topic. One student can struggle with more than one, so the shares don't add up to 100%.</p>
    ${cold.length?`<p class="source" style="margin-top:6px"><b>${cold.length} topics with no reported difficulty:</b> ${cold.map(x=>esc(x.name)).join("; ")}.</p>`:""}
  </section>
  <section class="card s5" id="clusters"><div class="eyebrow">Common mistakes</div><h2>Why students are stuck</h2>
    ${sel.clusters.map(clusterCard).join("")}
    ${sel.otherPct?`<p class="source" style="margin-top:8px">${sel.otherPct}% of struggling students show no clear pattern.</p>`:""}
  </section>
  </div>`;
}
const fv=k=>esc(S.forms[k]||"");
function contentPage(){
  const c=cat("physics"),ns=[...DEMO_NOTICES.physics].sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||a.age-b.age),dl=DEMO_DEADLINES.filter(d=>d.course==="physics");
  const dkey="ndraft-"+S.noticeN;
  return `<div class="page ${S.fadeIn?"fade":""}" data-keep="tcontent">
  ${teacherHead("Course content","Everything here reaches your Physics I students right away.")}
  <div class="grid12">
    <section class="card s7" id="nform"><div class="row" style="justify-content:space-between"><h2>Post a notice</h2><button class="btn small" data-a="notice-ai">Draft with AI (simulated)</button></div>
      <label class="flabel" for="nTitle">Title</label><input class="field" id="nTitle" data-field autocomplete="off" value="${fv("nTitle")}" placeholder="What's this about?">
      <label class="flabel" for="nBody">Message</label><textarea class="field" id="nBody" data-field data-draft-key="${dkey}" data-approve="nPost" ${S.noticeAnim&&!seen.has(dkey)?`data-ai="${dkey}"`:""} style="min-height:92px;margin-top:0" placeholder="Write to your students…">${fv("nBody")}</textarea>
      <div class="row" style="margin-top:8px;justify-content:space-between"><label class="check"><input type="checkbox" id="nPin"> Pin to the top</label><button class="btn primary" id="nPost" data-a="post-notice" ${pending.has(dkey)||(S.noticeAnim&&!seen.has(dkey))?"disabled":""}>Publish notice</button></div>
    </section>
    <div class="s5 stack">
      <section class="card"><h2>Add material</h2>
        <div class="row" style="flex-wrap:nowrap;margin-top:8px"><select class="field" id="mType" data-field style="width:130px;flex:none" aria-label="Material type">${["Slides","Recording","Problem set","Lab","Exam"].map(t=>`<option ${S.forms.mType===t?"selected":""}>${t}</option>`).join("")}</select><input class="field" id="mTitle" data-field autocomplete="off" value="${fv("mTitle")}" aria-label="Material title" placeholder="Title"><button class="btn primary" data-a="add-material">Add</button></div>
        <p class="source" style="margin-top:5px">Simulated: it adds the entry, with no real file behind it.</p>
      </section>
      <section class="card"><h2>Set a deadline</h2>
        <div class="row" style="flex-wrap:nowrap;margin-top:8px"><input class="field" id="dTitle" data-field autocomplete="off" value="${fv("dTitle")}" aria-label="Deadline title" placeholder="e.g. Sheet 6"><select class="field" id="dWhen" data-field style="width:82px;flex:none" aria-label="Day">${["Mon","Tue","Wed","Thu","Fri"].map(t=>`<option ${S.forms.dWhen===t?"selected":""}>${t}</option>`).join("")}</select><button class="btn primary" data-a="add-deadline">Add</button></div>
        ${dl.map(d=>`<div class="citem"><span>${esc(d.title)}</span><span class="row" style="gap:8px"><span class="tag in_progress">${d.when}</span><button class="linkbtn" data-a="del-deadline" data-v="${esc(d.title)}">Remove</button></span></div>`).join("")}
      </section>
    </div>
    <section class="card s12" id="topicctl"><h2>Level controls</h2><p class="source">Focus levels get a star on your students' maps. Closing a quiz hides it until you reopen it.</p>
      <table class="stable"><thead><tr><th>Level</th><th>Struggling</th><th>This week's focus</th><th>Practice quiz</th></tr></thead><tbody>
      ${DEMO_DATA.physics.topics.map(t=>{const st=topicStats("physics",t.id),f=S.focus.has(t.id),cl=S.quizClosed.has(t.id);return `<tr><td><b>${t.level}. ${esc(t.name)}</b></td><td>${st.score}%</td><td><button class="sw ${f?"on":""}" role="switch" aria-checked="${f}" aria-label="Focus on ${esc(t.name)}" data-a="toggle-focus" data-v="${t.id}"><i></i></button></td><td><button class="sw ${cl?"":"on"}" role="switch" aria-checked="${!cl}" aria-label="Quiz open for ${esc(t.name)}" data-a="toggle-quiz" data-v="${t.id}"><i></i></button> <span class="muted" style="font-size:13.5px">${cl?"Closed":"Open"}</span></td></tr>`}).join("")}
      </tbody></table></section>
    <section class="card s7"><h2>Your notices</h2>
      ${ns.map(n=>`<div class="notice"><div class="row" style="justify-content:space-between"><b>${esc(n.title)}</b><span class="row" style="gap:8px"><button class="linkbtn" data-a="pin-notice" data-v="${n.id}">${n.pin?"Unpin":"Pin"}</button><button class="linkbtn" data-a="del-notice" data-v="${n.id}">Delete</button></span></div><p>${esc(n.body)}</p></div>`).join("")}
    </section>
    <section class="card s5"><h2>Your materials</h2>
      ${c.uploads.map(u=>`<div class="citem"><span><span class="feed-type t-${esc(u.type.split(" ")[0])}">${esc(u.type)}</span> ${esc(u.title)}</span><button class="linkbtn" data-a="del-material" data-v="${esc(u.title)}">Remove</button></div>`).join("")}
    </section>
  </div></div>`;
}
const shortName=t=>t.short||t.name;
function clusterCard(cl){
  const d=S.drafts[cl.id],sent=S.fixes.find(f=>f.cluster===cl.id);
  const key="draft-"+cl.id,isPending=pending.has(key);
  return `<div class="cl" id="cl-${cl.id}">
    <div class="cl-h"><b>${esc(cl.name)}</b><span class="pct">${cl.pct}%</span></div>
    <div class="bar"><i style="width:${cl.pct}%"></i></div>
    ${cl.msgs.slice(0,2).map(m=>`<p class="quote">"${esc(m)}"</p>`).join("")}
    ${sent?`<div class="row" style="margin-top:8px"><span class="tag done">Sent to students</span><button class="btn small" data-a="go-student" data-v="${cl.id}">See it as a student</button><button class="btn small" data-a="withdraw" data-v="${cl.id}">Withdraw and edit</button></div>`
    :d?`<label class="ai-label" for="ta-${cl.id}" style="display:block;margin-top:8px">Draft by AI Assistant (simulated). Edit it before sending.</label>
      <textarea id="ta-${cl.id}" data-draft="${cl.id}" data-draft-key="${key}" data-approve="ok-${cl.id}" ${seen.has(key)?"":`data-ai="${key}"`} ${isPending?"readonly":""}>${esc(d.text)}</textarea>
      <div class="row" style="margin-top:6px"><button class="btn go" id="ok-${cl.id}" data-a="approve" data-v="${cl.id}" ${isPending||!seen.has(key)?"disabled":""}>Approve &amp; send</button></div>`
    :`<div style="margin-top:8px"><button class="btn" data-a="draft" data-v="${cl.id}">Draft a fix</button></div>`}
  </div>`;
}

/* ============ Actions ============ */
function fail(id,mistake){
  const u=tp(id);u.fails++;
  if(u.fails>=2&&!u.videoShown){u.videoShown=true;S.video={course:S.course,topic:id,mistake};S.videoAnimated=false}
}
const A={
  course(v){if(S.course===v)return;S.course=v;S.fadeIn=true},
  view(v){if(S.view===v)return;if(v==="teacher"){S.studentCourse=S.course;S.course="physics"}else if(S.studentCourse)S.course=S.studentCourse;S.view=v;S.fadeIn=true},
  reset(){location.reload()},
  node(v,el){
    const cid=el.dataset.c||S.course,t=topicIn(cid,v);
    if(status(cid,t)==="locked"&&!S.fixes.some(f=>f.course===cid&&f.topic===v)){
      toast("Locked: finish "+t.prereq.map(p=>topicIn(cid,p).name).join(", ")+" first");return}
    S.course=cid;S.openCourse=cid;S.page="course";S.courseTab="course";S.courseView="topic";S.levelTab="learn";S.sel[cid]=v;S.fadeIn=true;
    const p=document.getElementById("panel");if(p)p.scrollTop=0;
  },
  pick(v){tp(S.sel[S.course]).sel=+v},
  submit(){
    const id=S.sel[S.course],u=tp(id),p=SCRIPTED_AI.problems[id],o=p.options[u.sel],name=topicIn(S.course,id).name;
    if(u.sel===null)return;
    if(o.ok){
      u.solved=true;S.done[S.course].add(id);
      const unlocked=course().topics.filter(t=>t.prereq.includes(id)&&status(S.course,t)==="in_progress").map(t=>t.name);
      u.feedback={ok:true,key:`fb-${id}-ok`,text:"Correct! You've finished "+name+"."+(unlocked.length?" Unlocked: "+unlocked.join(", ")+".":"")};
      if(unlocked.length)toast("Unlocked: "+unlocked.join(", "));
      logEvent(`Student solved ${name} after ${u.fails} failed attempt${u.fails===1?"":"s"} and hint level ${u.hint}`);
      S.scrollTo=null;return;
    }
    u.wrongOpts.add(u.sel);
    u.mistake=o.m||null;
    u.feedback={ok:false,key:`fb-${id}-${u.sel}-${u.fails}`,text:o.m?p.feedback[o.m]:(o.fb||p.wrong)};
    logEvent(`Student submitted a wrong answer on ${name}: "${o.t}"`);
    fail(id,o.m);u.sel=null;
    S.scrollTo=o.m?"#quiz":null;
  },
  quiz(v,el){
    const id=S.sel[S.course],u=tp(id),qs=SCRIPTED_AI.problems[id].quiz[u.mistake],i=+el.dataset.q;
    const a=u.quiz[u.mistake]||(u.quiz[u.mistake]={});
    a[i]=+v;
    if(+v!==qs[i].a){fail(id,u.mistake);logEvent(`Student missed a follow-up question on ${topicIn(S.course,id).name}`)}
  },
  hint(v){
    const id=S.sel[S.course],u=tp(id);
    if(+v!==u.hint+1)return;
    u.hint=+v;S.scrollTo="#hints";
    logEvent(`Student used hint level ${v} on ${topicIn(S.course,id).name}`);
  },
  stuck(){const id=S.sel[S.course],u=tp(id);u.stuck=!u.stuck;if(u.stuck){S.scrollTo="#stuck";logEvent(`Student pressed "I'm stuck" on ${topicIn(S.course,id).name}`)}},
  step(v){const u=tp(S.sel[S.course]);u.step=+v;u.style=null;S.scrollTo="#styles"},
  style(v){tp(S.sel[S.course]).style=v;S.scrollTo="#styles"},
  "video-close"(){S.video=null},
  watch(){S.modal={type:"demo",title:videoData().title}},
  "modal-close"(){
    const tb=S.tb[S.course];
    if(S.modal&&S.modal.type==="tb"&&tb){tb.token++;tb.auto=false;tb.busy=false}
    S.modal=null;
  },
  nav(v){S.page=v;S.fadeIn=true},
  "open-course"(v){S.openCourse=v;S.progressCourse=v;if(cat(v).live)S.course=v;S.page="course";S.courseTab="home";S.courseView="map";S.fadeIn=true},
  tab(v){S.courseTab=v;if(v==="course")S.courseView="map";S.fadeIn=true},
  "to-map"(){S.courseView="map";S.fadeIn=true},
  "pick-course"(v){S.progressCourse=v;S.fadeIn=true},
  due(v){const [c,t]=v.split(":");S.openCourse=c;if(cat(c).live)S.course=c;S.page="course";S.courseTab=t;S.courseView="map";S.fadeIn=true},
  sort(v){S.sort=v},
  "tq-open"(){const id=S.sel[S.course];S.tqOpen[id]=!S.tqOpen[id];if(S.tqOpen[id])S.scrollTo="#tq"},
  tq(v,el){const id=S.sel[S.course],a=S.tq[id]||(S.tq[id]={}),i=+el.dataset.q;a[i]=+v;
    if(+v!==SCRIPTED_AI.quizzes[id][i].a)logEvent(`Student missed a topic quiz question on ${topicIn(S.course,id).name}`)},
  "lab-task"(v){const [id,i]=v.split(":"),l=DEMO_LABS[S.course].labs.find(x=>x.id===id);S.labTasks[v]=!taskDone(l,+i)},
  "lab-claim"(v){S.labOwner[v]="you";toast("Task added to your list")},
  "lab-nudge"(v){toast("Reminder sent to "+v+" (simulated)")},
  "sub-toggle"(v){S.subsDone[v]=!S.subsDone[v]},
  "level-tab"(v){S.levelTab=v;const p=document.getElementById("panel");if(p)p.scrollTop=0},
  "unit-go"(v){S.unit[S.sel[S.course]]=+v;const p=document.getElementById("panel");if(p)p.scrollTop=0},
  "unit-read"(v){const id=S.sel[S.course],t=topicIn(S.course,id),i=+v,all=subKeys(t);S.unitRead[unitKey(t,i)]=true;
    t.units[i].subs.forEach(n=>{S.subsDone[id+":"+n]=true});logEvent(`Student finished "${t.units[i].title}" in ${t.short}`)},
  "note-save"(v){const [k,f]=v.split("|"),txt=(S.forms[f]||"").trim();if(!txt){toast("Write a note first");return}S.notes[k]=txt;toast("Note saved")},
  resume(v){S.openCourse=v;S.course=v;S.page="course";S.courseTab="course";S.courseView="topic";S.levelTab="boss";const n=nextTopic(v);if(n)S.sel[v]=n.id;S.fadeIn=true},
  upload(v){S.modal={type:"demo",title:v}},
  "tb-open"(){tbGet();S.modal={type:"tb"}},
  "tb-auto"(){tbAuto();return "skip"},
  "tb-finish"(){const tb=tbGet();tb.token++;tb.busy=false;tb.done=true;logEvent(`Teach-back finished on "${SCRIPTED_AI.teachback[S.course].topic}"`)},
  "tb-restart"(){S.tb[S.course]=newTb(S.course)},
  "read-fix"(v){
    const f=S.fixes.find(x=>x.cluster===v);if(!f)return;
    f.read=true;S.course=f.course;S.openCourse=f.course;S.page="course";S.courseTab="course";S.courseView="topic";S.levelTab="boss";S.sel[f.course]=f.topic;S.scrollTo="#clar-"+v;S.fadeIn=true;
    const p=document.getElementById("panel");if(p)p.scrollTop=0;
  },
  heat(v){S.teacherTopic.physics=v;S.scrollTo="#density"},
  "heat-go"(v){S.teacherTopic.physics=v;S.tpage="struggle";S.fadeIn=true},
  "notify-group"(v){S.notified.add("risk:"+v);toast("TA notified: "+v.toLowerCase())},
  tnav(v){S.tpage=v;S.fadeIn=true},
  notice(v){S.openCourse=v;S.progressCourse=v;if(cat(v).live)S.course=v;S.page="course";S.courseTab="home";S.courseView="map";S.scrollTo="#notices";S.fadeIn=true},
  withdraw(v){const f=S.fixes.find(x=>x.cluster===v);if(f)S.drafts[v].text=f.text;S.fixes=S.fixes.filter(x=>x.cluster!==v);toast("Withdrawn. Students no longer see it")},
  "digest-notice"(){S.forms.nTitle="Thursday's lecture: "+hardest("physics")[0].topic.name;S.forms.nBody=SCRIPTED_AI.digest.physics.action+" Please review your free-body diagrams beforehand.";S.tpage="content";S.fadeIn=true;S.scrollTo="#nform"},
  "notice-ai"(){S.forms.nTitle="Extra practice on "+hardest("physics")[0].topic.name;S.forms.nBody="Many of you are stuck on the direction of friction. Before Thursday, try one connected-bodies problem, and check that friction reduces your acceleration. If it doesn't, your arrow points the wrong way.";S.noticeN++;S.noticeAnim=true},
  "post-notice"(){
    const t=(S.forms.nTitle||"").trim(),b=(S.forms.nBody||"").trim(),pin=document.getElementById("nPin").checked;
    if(!t||!b){toast("Add a title and a message first");return}
    DEMO_NOTICES.physics.unshift({id:"p"+Date.now(),title:t,body:b,age:0,pin,posted:true});
    S.forms.nTitle="";S.forms.nBody="";S.noticeAnim=false;toast("Notice published to Physics I");
  },
  "pin-notice"(v){const n=DEMO_NOTICES.physics.find(x=>x.id===v);if(n)n.pin=!n.pin},
  "del-notice"(v){DEMO_NOTICES.physics=DEMO_NOTICES.physics.filter(x=>x.id!==v);toast("Notice deleted")},
  "add-material"(){const t=(S.forms.mTitle||"").trim();if(!t){toast("Add a title first");return}
    cat("physics").uploads.unshift({type:S.forms.mType||"Slides",title:t,age:0});S.forms.mTitle="";toast("Material added")},
  "del-material"(v){const c=cat("physics");c.uploads=c.uploads.filter(u=>u.title!==v)},
  "add-deadline"(){const t=(S.forms.dTitle||"").trim();if(!t){toast("Add a title first");return}
    DEMO_DEADLINES.unshift({course:"physics",tab:"course",title:t,when:S.forms.dWhen||"Mon"});S.forms.dTitle="";toast("Deadline added")},
  "del-deadline"(v){const i=DEMO_DEADLINES.findIndex(d=>d.course==="physics"&&d.title===v);if(i>=0)DEMO_DEADLINES.splice(i,1)},
  "toggle-focus"(v){S.focus.has(v)?S.focus.delete(v):S.focus.add(v)},
  "toggle-quiz"(v){S.quizClosed.has(v)?S.quizClosed.delete(v):S.quizClosed.add(v)},
  draft(v){S.drafts[v]={text:SCRIPTED_AI.fixes[v]};S.scrollTo="#cl-"+v},
  approve(v){
    const ta=document.getElementById("ta-"+v),text=(ta?ta.value:S.drafts[v].text).trim();
    if(!text){toast("Write the clarification first");return}
    const tid=S.teacherTopic.physics,t=topicIn("physics",tid),cl=t.clusters.find(x=>x.id===v);
    S.fixes.push({cluster:v,course:S.course,topic:tid,name:cl.name,text,read:false});
    toast("Sent to students: "+t.name);
  },
  "go-student"(v){
    const f=S.fixes.find(x=>x.cluster===v);
    S.view="student";S.fadeIn=true;
    if(f){f.read=true;S.course=f.course;S.openCourse=f.course;S.page="course";S.courseTab="course";S.courseView="topic";S.levelTab="boss";S.sel[f.course]=f.topic;S.scrollTo="#clar-"+v}
  },
  notify(v){S.notified.add(v);toast("TA notified about "+v.replace(/^(physics|algo)/,""))}
};
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el||el.disabled)return;
  const r=A[el.dataset.a](el.dataset.v,el);
  if(r==="skip")return;
  render();S.fadeIn=false;
});
document.addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".mnode.click")){e.preventDefault();A.node(e.target.dataset.v,e.target);render();S.fadeIn=false}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".tnode")){e.preventDefault();const v=e.target.dataset.v;A.heat(v);render();const n=document.querySelector(`.tnode[data-v="${v}"]`);if(n)n.focus()}
  if(e.key==="Escape"&&S.modal){A["modal-close"]();render()}
});
document.addEventListener("input",e=>{if(!e.target.dataset)return;if(e.target.dataset.draft)S.drafts[e.target.dataset.draft].text=e.target.value;if("field" in e.target.dataset)S.forms[e.target.id]=e.target.value});
document.addEventListener("submit",e=>{
  if(e.target.dataset.form!=="tb")return;
  e.preventDefault();
  const i=document.getElementById("tbInput"),v=i.value;i.value="";
  tbSend(v);
});
render();
</script>
