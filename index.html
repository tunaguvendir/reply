:root{
  --bg:#ffffff;--panel:#ffffff;--panel2:#f4f6f8;--line:#e8ebef;--line2:#cdd3da;--text:#1b2430;--text2:#435063;--muted:#667385;
  --accent:#0b7a55;--accent-soft:#e6f6ef;--on-accent:#ffffff;--done:#0b7a55;--done-soft:#e6f6ef;--info:#1f6fd6;--info-soft:#e8f2fe;
  --warn:#9a6a00;--warn-soft:#fff6d8;--bad:#c9531c;--bad-soft:#fff0e6;--rose:#cf3f68;--rose-soft:#ffeef2;--lilac:#6b49d6;--lilac-soft:#f1edfe;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:500 15.5px/1.5 "Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;display:grid;grid-template-columns:240px 1fr;height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1{font-size:27px;font-weight:750;letter-spacing:-.02em;line-height:1.2}
b{font-weight:700}

/* Sidebar */
#side{background:var(--bg);border-right:1px solid var(--line);padding:18px 14px 14px;display:flex;flex-direction:column;gap:3px;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 14px}
.logo{width:32px;height:32px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand b{font-size:19px;font-weight:800;letter-spacing:-.02em}
.navbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;border-radius:10px;color:var(--text2);font-weight:600;transition:.15s}
.navbtn:hover{background:var(--panel2)}
.navbtn.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.navbtn small{font-size:12.5px;font-weight:600;color:var(--muted)}
.side-card{margin-top:10px;padding:10px 12px;border-radius:14px}
.side-card.next{background:var(--accent-soft)}
.side-card.note-card{background:var(--rose-soft)}
.side-card .lbl,.side-h{font-size:12.5px;font-weight:700;color:var(--muted)}
.side-card.next .lbl{color:var(--accent)}.side-card.note-card .lbl{color:var(--rose)}
.side-card b{display:block;line-height:1.3;margin:1px 0 6px;font-size:14px}
.side-h{margin:12px 10px 2px}
.due{display:grid;grid-template-columns:1fr auto;gap:8px;width:100%;text-align:left;padding:4px 10px;border-radius:9px;font-size:13.5px;line-height:1.3;align-items:center}
.due:hover{background:var(--panel2)}
.due span{min-width:0}.due small{display:block;color:var(--muted);font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.due i{font-style:normal;font-weight:700;font-size:12.5px;color:var(--bad);background:var(--bad-soft);padding:1px 7px;border-radius:99px}
.side-foot{margin-top:auto;padding-top:12px;display:grid;gap:7px}
.seg{display:flex;background:var(--panel2);border-radius:10px;padding:3px}
.seg button{flex:1;padding:5px 11px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted);transition:.15s;white-space:nowrap;position:relative}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px #1b243022}
.seg .dot{position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--rose)}
.note{font-size:12.5px;color:var(--muted);line-height:1.35;padding:0 2px}
.note b{color:var(--warn)}
.reset{color:var(--muted);font-size:12.5px;font-weight:600;text-align:left;padding:0 2px}
.reset:hover{color:var(--text)}

/* Layout */
#app{height:100vh;min-width:0;overflow:hidden}
.page{height:100%;overflow-y:auto;padding:22px 26px 28px;display:flex;flex-direction:column;gap:14px}
.fade{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
@keyframes slideIn{from{transform:translateX(120%)}to{transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes ring{0%{r:25;opacity:.55}100%{r:37;opacity:0}}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:16px;flex:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 1px 2px #1b24300a}
.card h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
.eyebrow{font-size:13.5px;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)}
.source{font-size:13px;color:var(--muted)}
.btn{padding:8px 14px;border-radius:10px;font-weight:650;background:#fff;border:1px solid var(--line2);transition:.15s;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--panel2)}
.btn:disabled{opacity:.45}
.btn.primary,.btn.go{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled),.btn.go:hover:not(:disabled){background:#096a4a}
.btn.small{padding:5px 11px;font-size:13.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid12{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;align-items:stretch}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.stack{display:flex;flex-direction:column;gap:14px}
.progress{height:8px;border-radius:5px;background:#e9edf1;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;border-radius:5px;background:var(--c,var(--accent));transition:width .5s ease}
.cbadge{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:12.5px;font-weight:800;flex:none}

/* Home */
.overall{display:block;width:100%;text-align:left;background:var(--accent-soft);border:1px solid #bfe8d6;border-radius:16px;padding:18px;transition:.15s}
.overall:hover{transform:translateY(-2px);box-shadow:0 6px 18px #0b7a5522}
.overall .eyebrow{color:var(--accent)}
.bigpct{font-size:52px;font-weight:800;line-height:1.05;letter-spacing:-.03em;margin-top:4px;color:var(--accent)}
.overall .progress{background:#fff}
.seemap{display:block;margin-top:10px;font-weight:700;color:var(--accent);font-size:14.5px}
.cont{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.eyebrow+.cont{border-top:0}
.feed-row{display:grid;grid-template-columns:112px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:8px;border-radius:10px;border-top:1px solid var(--line)}
.feed-row:first-of-type{border-top:0}
.feed-row:hover{background:var(--panel2)}
.feed-row.hot{background:var(--rose-soft);border-top-color:transparent}
.feed-type{justify-self:start;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--panel2);color:var(--text2)}
.feed-type.t-Recording{background:var(--lilac-soft);color:var(--lilac)}
.feed-type.t-Slides{background:var(--info-soft);color:var(--info)}
.feed-type.t-Problem,.feed-type.t-Assignment{background:var(--bad-soft);color:var(--bad)}
.feed-type.t-Lab{background:var(--accent-soft);color:var(--accent)}
.feed-type.t-Exam,.feed-type.t-Practice{background:var(--warn-soft);color:var(--warn)}
.feed-type.t-Clarification,.feed-type.t-Notice{background:var(--rose);color:#fff}
.feed-title{font-weight:600;min-width:0}
.feed-title small{display:block;color:var(--muted);font-size:13px;font-weight:500}
.when{font-size:13px;color:var(--muted);white-space:nowrap}

/* Courses */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.crow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:14px;transition:.15s}
.crow:hover{transform:translateY(-2px);box-shadow:0 6px 16px #1b243014}
.crow b{font-weight:700}
.crow small{display:block;color:var(--muted);font-size:13px}
.crow .progress{margin-top:6px;height:6px}
.pct-r{font-weight:750}
.tag{font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.tag.done{background:var(--done-soft);color:var(--done)}
.tag.in_progress{background:var(--bad-soft);color:var(--bad)}
.tag.locked{background:var(--panel2);color:var(--muted)}
.tag.live{background:var(--accent-soft);color:var(--accent);margin-left:6px}
.back{color:var(--accent);font-weight:700;font-size:14px;padding:0}
.back:hover{text-decoration:underline}

/* Course */
.chead{display:grid;grid-template-columns:auto 1fr 180px;gap:12px;align-items:center;flex:none}
.chead h1{font-size:24px}
.tabs{display:flex;gap:6px;flex:none}
.tabs button{padding:6px 16px;border-radius:99px;color:var(--text2);font-weight:650;transition:.15s}
.tabs button:hover{background:var(--panel2)}
.tabs button.on{background:var(--text);color:#fff}
.todo{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.todo:first-of-type{border-top:0}
.todo i{font-style:normal;width:20px;text-align:center;color:var(--muted)}
.todo.ok i{color:var(--done)}
.callout{padding:12px 14px;border-radius:12px;background:var(--panel2);font-size:14.5px;color:var(--text2)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;flex:none}
.stat-t{border-radius:16px;padding:14px 18px}
.stat-t.a{background:var(--accent-soft)}.stat-t.a .eyebrow,.stat-t.a .statn{color:var(--accent)}
.stat-t.b{background:var(--info-soft)}.stat-t.b .eyebrow,.stat-t.b .statn{color:var(--info)}
.stat-t.c{background:var(--bad-soft)}.stat-t.c .eyebrow,.stat-t.c .statn{color:var(--bad)}
.statn{font-size:28px;font-weight:800;line-height:1.2;letter-spacing:-.02em}
.statn.small{font-size:18px;line-height:1.9}
.lists{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:none}
.chip{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px;margin:4px 3px 0 0;background:var(--panel2);color:var(--text2)}
.chip.d{color:var(--done);background:var(--done-soft)}

/* Map */
.map svg{width:100%;height:auto;display:block}
.mnode{outline:none}
.mnode.click{cursor:pointer}
.mnode.locked.click{cursor:not-allowed}
.mnode .c{transition:transform .15s;transform-box:fill-box;transform-origin:center}
.mnode.click:hover .c,.mnode.click:focus-visible .c{transform:scale(1.1)}
.mnode:focus-visible .c{stroke:var(--text);stroke-width:3}
.mnode.done .c{fill:var(--done)}
.mnode.current .c{fill:#e8743b}
.mnode.in_progress .c{fill:#fff;stroke:var(--info);stroke-width:3}
.mnode.locked .c{fill:#e9edf1}
.mnode .pulse{fill:#e8743b;animation:ring 1.8s ease-out infinite}
.mnode text.lab{font-size:13.5px;font-weight:650;fill:var(--text);text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round;pointer-events:none}
.mnode.locked text.lab{fill:var(--muted);font-weight:550}
.mnode .here{fill:#e8743b}
.mnode .heret{fill:#fff;font-size:12px;font-weight:750;text-anchor:middle}
.mnode .flag{fill:var(--rose)}.mnode .flagt{fill:#fff;font-size:13px;font-weight:800;text-anchor:middle}
.branch{fill:none;stroke:#dfe4ea;stroke-width:5;stroke-linecap:round;stroke-dasharray:1 10}
.branch.grown{stroke:#7fd1ae;stroke-dasharray:none}
.leaf{fill:#7fd1ae}
.legend-m{display:flex;flex-wrap:wrap;gap:16px;font-size:13.5px;color:var(--text2);font-weight:600;margin-top:6px}
.legend-m span{display:inline-flex;gap:6px;align-items:center}
.legend-m i{width:13px;height:13px;border-radius:50%;display:inline-block}
.cpick{display:flex;flex-wrap:wrap;gap:6px;flex:none}
.cpick button{display:inline-flex;gap:7px;align-items:center;padding:5px 12px;border-radius:99px;border:1px solid var(--line);font-size:13.5px;font-weight:650;color:var(--text2);transition:.15s}
.cpick button:hover{background:var(--panel2)}
.cpick button i{width:9px;height:9px;border-radius:50%}
.cpick button.on{color:var(--text);box-shadow:inset 0 0 0 1.5px currentColor}
.here-card{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.here-card b{font-size:21px;font-weight:750;letter-spacing:-.01em;display:block;line-height:1.25}

/* Topic */
.student{height:100%;display:flex;flex-direction:column;padding:22px 26px 16px;gap:12px}
.banner{display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:12px;background:var(--rose-soft);flex:none}
.banner.new{animation:drop .35s ease}
.banner span{flex:1;font-weight:650}
.banner .btn.primary{background:var(--rose);border-color:var(--rose)}
.banner .btn.primary:hover{background:#b83359}
.scroll{overflow-y:auto;min-height:0}
#panel{flex:1;padding:18px 22px}
.panel-in{max-width:840px;margin:0 auto}
.crumb{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.panel-h{display:flex;justify-content:space-between;gap:10px;align-items:center}
.panel-h h2{font-size:23px;font-weight:750;letter-spacing:-.015em}
.problem{font-size:17px;font-weight:550;margin:8px 0 12px;white-space:pre-wrap}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{text-align:left;padding:10px 13px;border-radius:11px;background:#fff;border:1.5px solid var(--line);font-weight:600;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--line2);background:var(--panel2)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--done);background:var(--done-soft);color:var(--done)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.sec{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.sec h3{font-size:16px;margin-bottom:8px;font-weight:700}
.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rung{padding:9px;border-radius:11px;font-weight:700;border:1.5px solid var(--line);background:#fff;transition:.15s;font-size:15px}
.rung small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
.rung:hover:not(:disabled){background:var(--panel2)}
.rung:disabled{opacity:.42}
.rung.used{opacity:1;border-color:transparent}
.rung.l1.used{background:var(--accent-soft);color:var(--accent)}
.rung.l2.used{background:var(--warn-soft);color:var(--warn)}
.rung.l3.used{background:var(--rose-soft);color:var(--rose)}
.ai{margin-top:10px;padding:11px 14px;border-radius:12px;background:var(--panel2)}
.ai.c1{background:var(--accent-soft)}.ai.c2{background:var(--warn-soft)}.ai.c3{background:var(--rose-soft)}.ai.c4{background:var(--info-soft)}.ai.c5{background:var(--bad-soft)}
.ai-label{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:2px}
.ai-text{white-space:pre-wrap;min-height:1.4em}
.ai-extra{margin-top:8px}
.ai-extra:empty{display:none}
.thinking{color:var(--muted)}
.thinking i{animation:blink 1.1s infinite;font-style:normal}.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
pre{margin:0;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#fff;border-radius:10px;padding:10px;overflow-x:auto}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.step{width:100%;text-align:left;padding:9px 12px;border-radius:11px;background:#fff;border:1.5px solid var(--line);display:flex;gap:10px;transition:.15s}
.step:hover{background:var(--panel2)}
.step.on{border-color:var(--warn);background:var(--warn-soft)}
.step b{color:var(--muted);flex:none}
.star{color:var(--warn);font-weight:700;font-size:12.5px;white-space:nowrap;margin-left:auto;padding-left:8px}
.clar{background:var(--rose-soft);border-radius:12px;padding:12px 14px;margin:10px 0 12px}
.clar b{color:var(--rose)}
.clar p{white-space:pre-wrap;margin-top:5px}
.quiz{display:grid;gap:10px;margin-top:10px}
.q{padding:12px 14px;border-radius:12px;background:var(--panel2)}
.q p{font-weight:650;margin-bottom:7px}
.why{margin-top:7px;font-size:14.5px}
.why.ok{color:var(--done)}.why.bad{color:var(--bad)}
.video{position:fixed;right:18px;bottom:18px;width:360px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 12px 36px #1b243033;z-index:20}
.video.new{animation:slideIn .4s ease-out}
.video h3{font-size:17px;margin:4px 0;font-weight:700}
.ts{color:var(--accent);font-weight:700}
.x{float:right;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px}

/* Lab */
.lab h3{font-size:17px;font-weight:700}
.chk{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;padding:5px 2px}
.chk i{width:19px;height:19px;flex:none;margin-top:2px;border:1.5px solid var(--line2);border-radius:6px;display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff}
.chk.on i{background:var(--accent);border-color:var(--accent)}
.chk.on span{color:var(--muted);text-decoration:line-through}

/* Teacher */
.teacher{height:100%;overflow-y:auto;padding:22px 26px 28px;display:grid;grid-template-columns:repeat(12,1fr);gap:14px;align-content:start}
.teacher .pagehead{grid-column:span 12}
.heat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.tile{padding:10px;min-height:80px;gap:4px;border-radius:11px;text-align:left;outline:2px solid transparent;outline-offset:2px;transition:transform .15s;display:flex;flex-direction:column;justify-content:space-between}
.tile:hover{transform:translateY(-2px)}
.tile.on{outline-color:var(--text)}
.tile b{font-size:23px;line-height:1;font-weight:800}
.tile span{font-size:13.5px;font-weight:700;line-height:1.2}
.legend{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend i{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,#2f6fde,#8a8fa8 50%,#f28c28)}
.cl{padding:12px 14px;border-radius:12px;background:var(--panel2);margin-top:9px}
.cl-h{display:flex;gap:12px;align-items:center}
.cl-h b{font-size:15.5px;flex:1}
.pct{font-size:22px;font-weight:800;color:var(--bad)}
.bar{height:6px;border-radius:3px;background:#e1e5ea;margin:6px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:#f28c28}
.quote{font-size:14px;color:var(--text2);border-left:2px solid var(--line2);padding-left:9px;margin:4px 0}
textarea{width:100%;min-height:128px;margin-top:6px;border-radius:10px;border:1.5px solid var(--line2);background:#fff;color:var(--text);font:500 15px/1.5 inherit;font-family:inherit;padding:10px;resize:vertical}
textarea:focus{border-color:var(--accent);outline:none}
.stat{display:flex;gap:14px;flex-wrap:wrap;margin-top:3px;font-size:14px;color:var(--muted)}
.stat b{color:var(--text)}
.action{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.action b{color:var(--accent)}
.tr{display:grid;grid-template-columns:190px 1fr 54px;align-items:center;gap:8px;font-size:13.5px;margin-top:5px}
.tr i{display:block;height:7px;border-radius:0 4px 4px 0;background:var(--info)}
.hard{margin-top:10px;padding:9px 11px;border-radius:10px;background:var(--bad-soft);font-size:14px}
.risk{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.risk:first-of-type{border-top:0}
.risk b{font-family:ui-monospace,Menlo,monospace}
.risk p{font-size:14px}
.events{grid-column:span 12}
.events li{font-size:14px;margin-top:3px}
.events ul{margin:6px 0 0;padding-left:18px}

.stats4{grid-column:span 12;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
button.stat-t{text-align:left;transition:.15s}
button.stat-t:hover{transform:translateY(-2px)}
.stat-t.r{background:var(--rose-soft)}.stat-t.r .eyebrow,.stat-t.r .statn{color:var(--rose)}
.stat-t .source{line-height:1.2}
.tedge{stroke:#dfe4ea;stroke-width:3}
.tnode{cursor:pointer;outline:none}
.tnode:hover circle:not(.ring):not(.fstar){filter:brightness(1.07)}
.tnode:focus-visible circle:not(.ring){stroke:var(--text);stroke-width:3}
.tnode .ring{fill:none;stroke:var(--text);stroke-width:2.5}
.tnode .tp{font-size:15px;font-weight:800;text-anchor:middle}
.tnode .tl{font-size:13.5px;font-weight:650;fill:var(--text);text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.fstar{fill:var(--warn)}
.notice{padding:11px 0;border-top:1px solid var(--line)}
h2+.notice{border-top:0}
.notice p{color:var(--text2);font-size:14.5px;margin-top:2px}
.tag.pin{background:var(--warn-soft);color:var(--warn)}
.sched{display:grid;grid-template-columns:96px 1fr auto;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.sched:first-child{border-top:0}
.focusbar{padding:10px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);flex:none}
.stable{width:100%;border-collapse:collapse;font-size:14px}
.stable th{text-align:left;font-size:12.5px;font-weight:700;color:var(--muted);padding:8px 8px 6px}
.stable td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:middle}
.stable tr.flag td{background:var(--rose-soft)}
.stable .mono{font-family:ui-monospace,Menlo,monospace}
.stable .reason{color:var(--rose);font-weight:600;font-size:13.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.flabel{display:block;font-size:13px;font-weight:700;color:var(--text2);margin:8px 0 3px}
.field{width:100%;min-width:0;padding:8px 11px;border-radius:9px;border:1.5px solid var(--line2);background:#fff;color:var(--text);font:inherit}
.field:focus{border-color:var(--accent);outline:none}
.check{display:inline-flex;gap:7px;align-items:center;font-size:14px;font-weight:600}
.citem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
h2+.citem{border-top:0}
.citem:first-of-type{margin-top:6px}
.linkbtn{color:var(--muted);font-weight:650;font-size:13px;padding:0}
.linkbtn:hover{color:var(--rose);text-decoration:underline}
.sw{width:38px;height:22px;border-radius:99px;background:var(--line2);position:relative;transition:.15s;vertical-align:middle}
.sw i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--accent)}
.sw.on i{left:19px}

.numt{fill:#fff;font-size:19px;font-weight:800;text-anchor:middle;pointer-events:none}
.mnode.in_progress .numt{fill:var(--info)}
.mnode.locked .numt{fill:#8b96a3}
.lvlt{font-size:12px;font-weight:700;fill:var(--muted);text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:4px;pointer-events:none}
.lvlgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex:none}
.lvlcard{display:flex;flex-direction:column;gap:3px;text-align:left;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:14px;transition:.15s}
.lvlcard:hover{transform:translateY(-2px);box-shadow:0 6px 16px #1b243014}
.lvlcard.current{border-color:#e8743b}
.lvlcard.locked{background:var(--panel2);border-color:transparent}
.lvlcard.locked b,.lvlcard.locked .lvls{color:var(--muted)}
.lvln{font-size:12.5px;font-weight:700;color:var(--muted)}
.lvlcard b{font-size:15px;line-height:1.25}
.lvls{font-size:13px;line-height:1.35;color:var(--text2);flex:1}
.subs{margin:10px 0 2px;border-radius:12px;background:var(--panel2);padding:12px 14px}
.subgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
.ltabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-top:8px}
.ltabs button{padding:4px 0 7px;font-weight:650;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.ltabs button.on{color:var(--accent);border-color:var(--accent)}
.subh{grid-column:1/-1;font-size:13px;font-weight:700;color:var(--accent);margin-top:8px}
.chk.sub{font-size:14px;padding:3px 2px}
.chk.sub i{background:#fff}
.chk.sub.on i{background:var(--accent)}
.chk.sub.on span{text-decoration:none;color:var(--text2)}
.chk.sub:disabled{cursor:default}
.teampct{text-align:right}
.teampct b{display:block;font-size:30px;font-weight:800;line-height:1.1;color:var(--accent);letter-spacing:-.02em}
.members{display:grid;gap:12px;flex:none;align-items:start}
.member{padding:14px;border-radius:14px;background:var(--panel2);min-width:0}
.member.me{background:var(--accent-soft)}
.member b{font-size:14.5px}
.mpct{margin-left:auto;font-size:16px!important;font-weight:800}
.member .chk{font-size:14px;padding:4px 0}
.member .chk.on span{text-decoration:none;color:var(--muted)}
.avatar{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;flex:none;font-size:13px;font-weight:800;background:var(--info-soft);color:var(--info)}
.avatar.me{background:var(--accent);color:#fff;font-size:11px}
.mnext{font-size:13px;color:var(--text2);margin:7px 0 2px;line-height:1.35}
.ltask{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:3px 0;border-top:1px solid var(--line)}
.ltask .chk{flex:1;min-width:0}
.chk.ro{cursor:default}
.chk.ro i{background:var(--panel2)}
.chk.ro.on i{background:var(--done);border-color:var(--done)}
.owner{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--text2);white-space:nowrap}
.owner .avatar{width:24px;height:24px;font-size:11px}
.owner .avatar.me{font-size:9px}

.s6{grid-column:span 6}
.teacher>.s6,.teacher>.s12{min-width:0}
.lrow{display:grid;grid-template-columns:180px 1fr 170px;gap:12px;align-items:center;width:100%;text-align:left;padding:6px 8px;border-radius:9px;font-size:14px}
.lrow:hover{background:var(--panel2)}
.lname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.lnum{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.lnum b{color:var(--text)}
.stack-bar{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;margin-top:0}
.card>.stack-bar{margin-top:10px}
.stack-bar i{display:block;min-width:3px}
.k-done{background:#0b7a55}.k-work{background:#6cb6ff}.k-lock{background:#e1e5ea}.k-idle{background:#e8743b}
.h0{background:#d8e6f7}.h1{background:#9cc3ee}.h2{background:#4f8fdb}.h3{background:#17498c}
.key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;font-weight:600;color:var(--text2);margin-top:8px}
.row>.key{margin-top:0}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{width:11px;height:11px;border-radius:3px;display:inline-block}
.dh{font-size:15px;font-weight:700;margin:12px 0 4px}
.drow{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) 112px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.dname{font-weight:600;line-height:1.3}
.dname small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
.dbar{display:block;height:10px;border-radius:0 5px 5px 0;background:#eef0f3}
.dbar i{display:block;height:100%;border-radius:0 5px 5px 0}
.dval{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.dval b{color:var(--text);font-size:14.5px}
#clusters .cl{margin-top:8px}

#panel.bare{background:none;border:0;box-shadow:none;padding:0 2px 8px;border-radius:0}
.bare .panel-in{max-width:860px}
.bare .crumb{margin:2px 0 6px}
.bare .ltabs{position:sticky;top:0;background:var(--bg);z-index:5;padding-top:6px}
.lcount{font-size:11.5px;font-weight:700;color:var(--muted);border:1px solid var(--line2);border-radius:5px;padding:0 4px;margin-left:2px}
.ltabs button.on .lcount{color:var(--accent);border-color:var(--accent)}
.unitnav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}

/* Seeded generator: fills DEMO_DATA[course].students with 30 records */
(function buildStudents(){
  for(const c of Object.values(DEMO_DATA)){
    let s=c.seed;
    const r=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
    const int=(a,b)=>a+Math.floor(r()*(b-a+1));
    const flagged=Object.fromEntries(c.flagged.map(f=>[f.n,f]));
    c.students=Array.from({length:30},(_,i)=>({
      id:"S-"+String(i+1).padStart(3,"0"),ability:flagged[i+1]?r()*.1:.2+r()*.8,
      topics:{},daysSinceProgress:int(0,5),recent:{problems:6,fullSolution:int(0,3)}
    }));
    for(const t of c.topics){
      const reached=c.students.filter(st=>t.prereq.every(p=>st.topics[p].status==="done"));
      const reachedIds=new Set(reached.map(st=>st.id));
      const byDone=[...reached].map(st=>[st,st.ability+r()*.35]).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
      const doneIds=new Set(byDone.slice(0,t.done).map(st=>st.id));
      const byStruggle=[...reached].map(st=>[st,st.ability+r()*.6]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
      const stuck=byStruggle.slice(0,t.struggle);
      const stuckIds=new Set(stuck.map(st=>st.id));
      const tags={};let k=0;
      const mixed=stuck.map(st=>[st,r()]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
      for(const cl of t.clusters)for(let j=0;j<cl.n;j++)tags[mixed[k++].id]=cl.id;
      for(const st of c.students){
        if(!reachedIds.has(st.id)){st.topics[t.id]={status:"locked",hint:0,fails:0,minutes:0,misconception:null};continue}
        const isStuck=stuckIds.has(st.id),fullHint=isStuck&&r()<.55;
        st.topics[t.id]={
          status:doneIds.has(st.id)?"done":"in_progress",
          hint:isStuck?(fullHint?3:2):int(0,2),
          fails:isStuck?(fullHint?int(0,3):int(2,3)):int(0,1),
          minutes:Math.round(t.baseMin*(isStuck?1.35:.85)*(.9+r()*.2)),
          misconception:tags[st.id]||null
        };
      }
    }
    for(const f of c.flagged){
      const st=c.students[f.n-1];
      if(f.type==="days")st.daysSinceProgress=f.v;
      if(f.type==="full")st.recent.fullSolution=f.v;
      if(f.type==="fails"){
        const entry=c.topics.map(t=>st.topics[t.id]).find(x=>x.status==="in_progress"&&(x.hint===3||x.fails>=2))
          ||c.topics.map(t=>st.topics[t.id]).find(x=>x.hint===3||x.fails>=2);
        if(entry)entry.fails=4;else st.daysSinceProgress=7;
      }
    }
    c.students.forEach(st=>delete st.ability);
  }
})();

/* Which syllabus topics each struggling Physics student found hard, as indexes into the level's topic list.
   A misconception cluster always maps to one topic, so the two views stay consistent. */
const DEMO_HOT={
 intro:{clusters:{in1:3},others:[[4,3],[2,1]]},
 kin:{clusters:{ki1:7},others:[[6,3],[9,3],[5,1],[8,1]]},
 newton:{clusters:{nw1:8,nw2:7,nw3:0,gv1:20},others:[[10,4],[15,3],[25,3],[18,2],[9,2],[14,1],[12,1]]},
 many:{clusters:{mo1:8,mo2:7},others:[[6,4],[5,3],[4,1]]},
 rot:{clusters:{ro1:3,ro2:2,ro3:6},others:[[4,3],[8,2],[6,2]]},
 fluids:{clusters:{fl1:5},others:[[7,2],[2,1]]},
 thermo1:{clusters:{th1:4,th2:9},others:[[3,2],[7,1]]},
 thermo2:{clusters:{tt1:2,tt2:7},others:[[6,2],[3,1]]}
};
(function assignHardTopics(){
  let s=77;
  const r=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const c=DEMO_DATA.physics;
  const pick=o=>{let x=r()*o.reduce((a,b)=>a+b[1],0);for(const [i,w] of o){x-=w;if(x<=0)return i}return o[0][0]};
  for(const t of c.topics)for(const st of c.students){
    const rec=st.topics[t.id];rec.hard=[];
    if(!isStruggling(rec))continue;
    const hot=DEMO_HOT[t.id];
    rec.hard.push(rec.misconception?hot.clusters[rec.misconception]:pick(hot.others));
    if(r()<.6){const extra=pick(hot.others);if(!rec.hard.includes(extra))rec.hard.push(extra)}
  }
})();
/* Everything computed from the records above */
function isStruggling(x){return x.status!=="locked"&&(x.hint===3||x.fails>=2)}
function topicStats(courseId,tid){
  const c=DEMO_DATA[courseId],t=c.topics.find(x=>x.id===tid);
  const rows=c.students.map(s=>s.topics[tid]).filter(x=>x.status!=="locked");
  const stuck=rows.filter(isStruggling);
  const pct=(a,b)=>b?Math.round(a/b*100):0;
  const clusters=t.clusters.map(cl=>{
    const n=stuck.filter(x=>x.misconception===cl.id).length;
    return{...cl,count:n,pct:pct(n,stuck.length)};
  });
  const classified=clusters.reduce((a,b)=>a+b.count,0);
  let hard=[];
  if(courseId==="physics"){
    let group="";
    hard=t.subs.flatMap(x=>{if(x[0]==="#"){group=x.slice(1);return[]}return[{name:x,group}]}).map((x,i)=>{
      const n=stuck.filter(y=>y.hard.includes(i)).length;return{...x,count:n,pct:pct(n,stuck.length)}});
  }
  return{hard,topic:t,reached:rows.length,stuck:stuck.length,score:pct(stuck.length,rows.length),
    fullHint:rows.filter(x=>x.hint===3).length,
    avgMin:rows.length?Math.round(rows.reduce((a,b)=>a+b.minutes,0)/rows.length):0,
    clusters,otherPct:pct(stuck.length-classified,stuck.length)};
}
function courseStats(cid){return DEMO_DATA[cid].topics.map(t=>topicStats(cid,t.id))}
function hardest(cid){return [...courseStats(cid)].sort((a,b)=>b.score-a.score)}
function atRisk(cid){
  const c=DEMO_DATA[cid];
  return c.students.map(s=>{
    const why=[];
    if(s.daysSinceProgress>=7)why.push("no progress in "+s.daysSinceProgress+" days");
    if(s.recent.fullSolution>=5)why.push("used full solution on "+s.recent.fullSolution+" of last "+s.recent.problems+" problems");
    for(const t of c.topics)if(s.topics[t.id].fails>=4)why.push(s.topics[t.id].fails+" failed attempts on "+t.name);
    return{id:s.id,why};
  }).filter(x=>x.why.length);
}

      steps:["Adiabatic means Q = 0, so W = −ΔU = nCv(T₁ − T₂).","TV^(γ−1) = const gives T₂ = 252 K.","W = 2.0 × 1.5 × 8.314 × 148 ≈ 3.69 kJ."],key:0,simple:"No heat comes in, so the gas pays for the work out of its own internal energy, and it cools down. That's why it does less work than an isothermal expansion, where heat keeps refilling the energy.",wrong:"Q = 0, so W = nCv(T₁ − T₂). Find T₂ from TV^(γ−1) = const.",
      video:{title:"Adiabatic processes for ideal gases",ts:"06:20",why:"You've missed this concept twice. This segment compares isothermal and adiabatic work."}},
    fluids:{q:"Water (ρ = 1000 kg/m³) flows through a horizontal pipe that narrows from 8.0 cm to 4.0 cm in diameter. Its speed in the wide part is 1.5 m/s. What's the pressure drop between wide and narrow sections?",
      options:[{t:"16.9 kPa",ok:true},{t:"3.4 kPa",fb:"You scaled the speed with the diameter. Continuity uses area, which goes as d². Halving d makes the speed 4 times larger: 6.0 m/s, not 3.0 m/s."},{t:"18.0 kPa",fb:"You used ½ρv₂² and left out v₁. Bernoulli depends on the difference: ½ρ(v₂² − v₁²)."},{t:"1.1 kPa",fb:"That's ½ρv₁², the kinetic term of the wide section alone. First find v₂ with continuity."}],
      hints:["Nudge: you need two equations. Which one gives the speed in the narrow section, and which one gives the pressure?","Partial step: continuity: v₂ = v₁(d₁/d₂)² = 1.5 × 4 = 6.0 m/s.","Full solution: Bernoulli at the same height: ΔP = ½ρ(v₂² − v₁²) = 500 × (36 − 2.25) = 16.9 kPa."],
      steps:["Continuity: A₁v₁ = A₂v₂, and A ∝ d², so v₂ = 6.0 m/s.","Bernoulli (same height): P₁ − P₂ = ½ρ(v₂² − v₁²).","ΔP = 16 875 Pa ≈ 16.9 kPa."],key:1,simple:"The water speeds up in the narrow part, so something must push it forward: the pressure behind it has to be higher than the pressure ahead. So pressure drops where speed rises. A Venturi meter measures flow using this drop.",wrong:"Use continuity with areas, then Bernoulli.",
      video:{title:"Continuity and Bernoulli",ts:"03:55",why:"You've missed this concept twice. This segment links flow speed with pressure."}},
    rot:{q:"A solid cylinder rolls without slipping from rest down a 30° incline. What is its speed after travelling 2.0 m along the slope? (g = 9.8 m/s²)",
      options:[{t:"3.61 m/s",ok:true},{t:"4.43 m/s",fb:"That's a frictionless sliding block: v = √(2gh). You left out rotational energy, which takes a third of the total for a solid cylinder."},{t:"3.13 m/s",fb:"That's a hoop, with I = MR². A solid cylinder has I = ½MR², so it's faster."},{t:"3.27 m/s",fb:"That's the acceleration in m/s², a = ⅔ g sin θ. You still need v = √(2as)."}],
      hints:["Nudge: the energy at the bottom has two parts. What are they, and how are v and ω connected?","Partial step: h = 2.0 sin 30° = 1.0 m. Then mgh = ½mv² + ½Iω², with I = ½mR² and ω = v/R.","Full solution: mgh = ¾mv², so v = √(4gh/3) = √13.07 ≈ 3.61 m/s."],
      steps:["Height lost: h = s sin 30° = 1.0 m.","Rolling: ω = v/R and I = ½mR², so KE = ½mv² + ¼mv² = ¾mv².","mgh = ¾mv² gives v = √(4gh/3) = 3.61 m/s."],key:1,simple:"Rolling shares its energy between moving forward and spinning. Friction does no net work in pure rolling, it only makes the spin happen, so energy is conserved. Mass and radius cancel: any solid cylinder gets the same speed. Only its shape, through I, matters.",wrong:"Include ½Iω² and use ω = v/R.",
      video:{title:"Rolling motion and energy",ts:"06:30",why:"You've missed this concept twice. This segment compares a hoop, a disk and a sphere."}},
    thermo2:{q:"1.0 kg of water at 80 °C is mixed with 1.0 kg of water at 20 °C in an insulated container (c = 4186 J/kg·K). What's the total entropy change?",
      options:[{t:"+36 J/K",ok:true},{t:"0 J/K",fb:"That would make the mixing reversible, and it isn't. Heat flows across a finite temperature difference, so entropy must rise in an isolated system."},{t:"+1868 J/K",fb:"You used Celsius in the logarithm. Entropy needs absolute temperatures: 353 K, 293 K and 323 K."},{t:"+73 J/K",fb:"You used Q/T at each starting temperature. T changes during the process, so integrate: ΔS = mc ln(T_f/T_i)."}],
      hints:["Nudge: both masses are equal. So what's the final temperature? Does T stay constant for either one?","Partial step: T_f = 50 °C = 323.15 K. For each mass, ΔS = mc ln(T_f/T_i), in kelvin.","Full solution: ΔS = 4186 × [ln(323.15/353.15) + ln(323.15/293.15)] = 4186 × (−0.0888 + 0.0974) ≈ +36 J/K."],
      steps:["Equal masses, so T_f = 50 °C = 323.15 K.","T varies, so integrate dS = mc dT/T: ΔS = mc ln(T_f/T_i).","Hot: −372 J/K. Cold: +408 J/K. Total: +36 J/K."],key:1,simple:"The same heat leaves the hot water and enters the cold water. But the cold water receives it at a lower temperature, and dQ/T is bigger when T is smaller. So the gain beats the loss, and the total is positive, as the Second Law requires.",wrong:"Use ΔS = mc ln(T_f/T_i) with kelvin temperatures.",
      video:{title:"Entropy in irreversible processes",ts:"04:48",why:"You've missed this concept twice. This segment computes entropy for a mixing problem."}},
    c:{q:"What does this C code leave in x and s?\n\nint a = 5, b = 2, i = 0, s = 0;\ndouble x = a / b;\nwhile (i < 5) {\n  if (i % 2) s += i * i;\n  i++;\n}",
      options:[{t:"x = 2.0, s = 10",ok:true},{t:"x = 2.5, s = 10",fb:"The value of s is right. But a / b divides two ints, so it truncates to 2 before it's stored in the double."},{t:"x = 2.0, s = 20",fb:"You summed the squares of the even numbers. i % 2 is true (non-zero) when i is odd."},{t:"x = 2.5, s = 30",fb:"Both parts are off: a / b is integer division, and only odd i are added."}],
      hints:["Nudge: which type is used when a / b is calculated? And when is i % 2 true?","Partial step: a / b is int / int = 2, then it converts to 2.0. i % 2 is non-zero for i = 1 and 3.","Full solution: x = 2.0 and s = 1² + 3² = 10."],
      steps:["a / b uses integer division: 2. Then it converts to 2.0.","i % 2 is true for odd i: 1 and 3.","s = 1 + 9 = 10."],key:0,simple:"C picks the operation from the operands, not from the variable receiving the result. Write (double)a / b to get 2.5.",wrong:"Watch for integer division and for what i % 2 means as a condition.",
      video:{title:"Types and conversions in C",ts:"01:45",why:"You've missed this concept twice. This segment shows when conversions happen."}},
    analysis:{q:"What is the running time of this code?\n\nfor (i = 1; i < n; i *= 2)\n  for (j = 0; j < i; j++)\n    count++;",
      options:[{t:"Θ(n)",ok:true},{t:"Θ(n log n)",fb:"This is the classic trap: log n outer steps, up to n inner steps. But the inner loop runs i times, not n times, and i is usually much smaller than n."},{t:"Θ(log n)",fb:"That counts only the outer loop. The inner loop's work must be added up."},{t:"Θ(n²)",fb:"Neither loop runs n times at every step. The outer loop doubles i rather than adding 1."}],
      hints:["Nudge: how many times does the inner loop run for each value of i? Add those up, rather than multiplying worst cases.","Partial step: the total is 1 + 2 + 4 + … up to about n. What does this geometric series add up to?","Full solution: the sum is less than 2n, so the code is Θ(n). For n = 128, count is exactly 127."],
      steps:["The inner loop runs i times, and i = 1, 2, 4, …","Total = 1 + 2 + 4 + … + 2^k, with 2^k < n.","This geometric sum is under 2n, so Θ(n)."],key:1,simple:"In a doubling series, the last term is nearly as big as all the others combined. So the total stays proportional to the last term, which is about n. This is the same reason building a heap is O(n).",wrong:"Add the inner loop's work across outer steps.",
      video:{title:"Counting nested loops precisely",ts:"03:33",why:"You've missed this concept twice. This segment works through dependent loops."}},
    data:{q:"What's wrong with this function?\n\nvoid freeList(node *h) {\n  while (h != NULL) {\n    free(h);\n    h = h->next;\n  }\n}",
      options:[{t:"It reads h->next after freeing h",ok:true},{t:"It leaks every node",fb:"It does call free on them. The problem is what it reads right after."},{t:"It frees the head twice",fb:"Each node is freed once. The bug is reading the freed node."},{t:"Nothing is wrong",fb:"It may even seem to work when you run it. That's the danger of undefined behaviour."}],
      hints:["Nudge: after free(h), does the memory h points to still belong to you?","Partial step: h->next reads from freed memory. Save it somewhere before calling free.","Full solution: use node *tmp = h->next; free(h); h = tmp; inside the loop."],
      steps:["free(h) gives the block back to the allocator.","h->next then reads that released block: undefined behaviour.","Save next in a temporary before calling free."],key:1,simple:"It's like leaving a hotel room, handing back the key, and then going back in to pick up your bag. It may work, or someone else may be there already. Take the bag first.",wrong:"Trace which memory is valid at each line.",
      video:{title:"Dynamic memory bugs in C",ts:"07:12",why:"You've missed this concept twice. This segment shows use-after-free with a memory checker."}},
    sort:{q:"How many element shifts does insertion sort perform on the array [5, 2, 4, 6, 1, 3]?",
      options:[{t:"9",ok:true},{t:"15",fb:"15 is the worst case for 6 elements, n(n−1)/2, when the array is reversed. This array isn't reversed."},{t:"6",fb:"Six is the array length. Each shift fixes exactly one inverted pair, so count the inversions."},{t:"12",fb:"Recount: the shifts for each new element are 1, 1, 0, 4 and 3."}],
      hints:["Nudge: each shift fixes exactly one inversion: a pair that's in the wrong order. Count the pairs.","Partial step: go element by element: inserting 2, 4, 6, 1, 3 takes 1, 1, 0, 4 and 3 shifts.","Full solution: 1 + 1 + 0 + 4 + 3 = 9 shifts."],
      steps:["Insert 2: 1 shift. Insert 4: 1 shift. Insert 6: 0 shifts.","Insert 1: 4 shifts. Insert 3: 3 shifts.","Total: 9, the number of inversions."],key:1,simple:"Insertion sort's cost is tied to how disordered the input is, which is why it's O(n) on nearly sorted arrays and O(n²) on reversed ones.",wrong:"Count inversions: pairs out of order.",
      video:{title:"Insertion sort and inversions",ts:"05:44",why:"You've missed this concept twice. This segment traces shifts on a whole array."}},
    rec:{q:"int f(int n) { if (n < 2) return n; return f(n-1) + f(n-2); }\n\nHow many times is f called in total, including the first call, to compute f(5)?",
      options:[{t:"15",ok:true},{t:"5",fb:"5 is the value of f(5), not the number of calls."},{t:"9",fb:"That's a common miscount. Use calls(n) = 1 + calls(n−1) + calls(n−2), with calls(0) = calls(1) = 1."},{t:"31",fb:"31 = 2⁵ − 1 assumes a full binary tree. But the right branch is shorter, since it uses n − 2."}],
      hints:["Nudge: write a recurrence for the number of calls, separate from the value.","Partial step: calls(n) = 1 + calls(n−1) + calls(n−2), with calls(0) = calls(1) = 1.","Full solution: calls for n = 0…5 are 1, 1, 3, 5, 9, 15. So 15 calls."],
      steps:["calls(0) = calls(1) = 1.","calls(n) = 1 + calls(n−1) + calls(n−2).","1, 1, 3, 5, 9, 15: f(5) makes 15 calls."],key:1,simple:"The call count grows just like the values, exponentially. f(2) alone gets computed 3 times here. That repetition is exactly what memoisation removes.",wrong:"Count calls with their own recurrence.",
      video:{title:"Counting recursive calls",ts:"06:05",why:"You've missed this concept twice. This segment draws the whole call tree."}},
    mod:{q:"list.h contains the line int count = 0; and is included by both main.c and list.c. Building the program fails. Why, and what's the fix?",
      options:[{t:"Multiple definition at link time. Use extern in the .h and define it in one .c",ok:true},{t:"Compile error: guard the .h with #ifndef",fb:"Include guards work per file. Each .c file still gets its own definition, so linking still fails."},{t:"The variable must be declared static in main.c",fb:"The problem is in the header, which defines storage in every file that includes it."},{t:"make needs a clean rebuild",fb:"A rebuild would produce the same two definitions. This is a linking problem."}],
      hints:["Nudge: each .c is compiled separately. How many times does count get defined?","Partial step: both object files have a definition of count, and the linker has to pick one.","Full solution: write extern int count; in the header, and int count = 0; in exactly one .c file."],
      steps:["#include copies the line into each .c file.","Two object files define the same symbol.","The linker rejects it: use extern in the header."],key:1,simple:"A header should declare (\"this exists somewhere\") and not define (\"create it here\"). Include guards only stop double inclusion within one file.",wrong:"Separate declaration from definition.",
      video:{title:"Compiling and linking multi-file programs",ts:"02:30",why:"You've missed this concept twice. This segment shows what the linker sees."}},
    disc:{q:"An undirected graph has 12 edges. Six vertices have degree 3, and all the others have degree 2. How many vertices does it have?",
      options:[{t:"9",ok:true},{t:"12",fb:"You set the vertex count equal to the edge count. Use the handshake lemma: the degrees add up to 2|E|."},{t:"8",fb:"Recount: the sum must be 24. The degree-3 vertices give 18, leaving 6 for degree-2 vertices. That's 3 of them."},{t:"6",fb:"Those six only supply 18 of the required 24 degrees."}],
      hints:["Nudge: what's the sum of all degrees in a graph with 12 edges?","Partial step: the sum is 2 × 12 = 24. Six vertices give 18. What's left?","Full solution: the remaining 6 degrees come from 3 vertices of degree 2. Total: 6 + 3 = 9."],
      steps:["Handshake lemma: Σdeg = 2|E| = 24.","Six degree-3 vertices give 18.","6 left, at degree 2 each: 3 more vertices. Total: 9."],key:0,simple:"Each edge has two ends and adds 1 to the degree of each. So the degrees always add up to twice the edges.",wrong:"Use Σdeg = 2|E|.",
      video:{title:"Graphs and trees: the counting rules",ts:"02:18",why:"You've missed this concept twice. This segment proves the handshake lemma."}},
    adt:{q:"You insert 5, 3, 8, 1, 4 in this order into an empty binary min-heap stored in an array. What does the array contain?",
      options:[{t:"[1, 3, 8, 5, 4]",ok:true},{t:"[1, 3, 4, 5, 8]",fb:"That's sorted order. A heap only requires each parent to be no larger than its children."},{t:"[1, 3, 5, 8, 4]",fb:"Insert one at a time, at the end, and swap upward only with parents. 8 never moves here."},{t:"[5, 3, 8, 1, 4]",fb:"That's the insertion order, with no sift-up applied."}],
      hints:["Nudge: each insert goes at the end and swaps upward while it's smaller than its parent. The parent of i is (i − 1) / 2.","Partial step: after 5, 3, 8 the array is [3, 5, 8]. Now 1 goes to index 3, and swaps with 5, then 3.","Full solution: after 1: [1, 3, 8, 5]. Then 4 goes to index 4. Its parent is 3, so no swap: [1, 3, 8, 5, 4]."],
      steps:["5, then 3 swaps up: [3, 5], then 8: [3, 5, 8].","1 swaps past 5 and 3: [1, 3, 8, 5].","4's parent is 3, so it stays: [1, 3, 8, 5, 4]."],key:1,simple:"A heap is only partially ordered: it guarantees the path from root to leaf is sorted, but siblings can be in any order. That's what makes insert O(log n).",wrong:"Trace sift-up one insertion at a time.",
      video:{title:"Binary heaps in an array",ts:"01:52",why:"You've missed this concept twice. This segment runs insertions step by step."}},
    problem:{q:"You schedule 6 distinct tasks in a sequence, where task A must come before task B. How many valid orderings are there?",
      options:[{t:"360",ok:true},{t:"720",fb:"720 = 6! ignores the constraint. In exactly half of all orderings, A comes before B."},{t:"120",fb:"120 = 5! would treat A and B as one glued block, but they don't need to be adjacent."},{t:"64",fb:"64 = 2⁶ is the powerset count, for in-or-out choices. Here order matters."}],
      hints:["Nudge: does order matter, and can items repeat? That selects your model.","Partial step: there are 6! permutations without the constraint. Pair each ordering with the one where A and B are swapped.","Full solution: exactly one of each pair is valid: 6! / 2 = 360."],
      steps:["Unconstrained: 6! = 720 permutations.","Swapping A and B pairs up all orderings.","Exactly one per pair is valid: 360."],key:1,simple:"Symmetry saves counting here. In a backtracking solution, you'd prune any branch that places B before A, and it would visit these 360 leaves.",wrong:"Start from permutations, then apply the constraint.",
      video:{title:"Search spaces: powerset, permutations, combinations",ts:"04:22",why:"You've missed this concept twice. This segment matches problems with models."}},
    symbol:{q:"A hash table has 7 slots, h(k) = k mod 7, and linear probing. You insert 10, 17, 24, 3 in this order. In which slot does 3 end up?",
      options:[{t:"6",ok:true},{t:"3",fb:"3 mod 7 is 3, but that slot is taken by 10. Linear probing moves on to the next free slot."},{t:"4",fb:"Slot 4 already holds 17, which also hashed to 3."},{t:"0",fb:"Probing only wraps around after slot 6, and slot 6 is free."}],
      hints:["Nudge: compute k mod 7 for each key. What do you notice?","Partial step: all four keys hash to slot 3. So they fill 3, 4, 5, then…","Full solution: 10 → 3, 17 → 4, 24 → 5, 3 → 6."],
      steps:["10, 17, 24 and 3 all give k mod 7 = 3.","Each collision moves on to the next free slot.","So 3 lands in slot 6, after 3 probes past occupied slots."],key:1,simple:"That's primary clustering: one run of filled slots keeps growing, and every new key that hashes into it makes the run longer. Search cost goes up with it.",wrong:"Trace each insertion and collision.",
      video:{title:"Hash tables and clustering",ts:"03:05",why:"You've missed this concept twice. This segment animates linear probing."}},
    graphs:{q:"Edges (undirected): A–B 4, A–C 2, B–C 1, B–D 5, C–D 8, C–E 10, D–E 2. With Dijkstra from A, what's the shortest distance to E, and in what order are the nodes finalised?",
      options:[{t:"10, order A C B D E",ok:true},{t:"12, order A C E B D",fb:"12 is the path A–C–E. But E can't be finalised while B (3) and D (8) have smaller distances."},{t:"11, order A B C D E",fb:"Check A–B: the direct edge costs 4, but via C it's 3. C (2) is taken before B."},{t:"8, order A C B D E",fb:"The order is right. But 8 is the distance to D. E is 8 + 2 = 10."}],
      hints:["Nudge: start with dist[A] = 0. Always finalise the unfinished node with the smallest distance, then relax its edges.","Partial step: A gives C = 2, B = 4. C then gives B = 3, D = 10, E = 12. Finalise B next.","Full solution: B gives D = 8. D gives E = 10. Order A, C, B, D, E, with dist[E] = 10."],
      steps:["Finalise A, then C (2). B improves from 4 to 3.","Finalise B (3). D improves from 10 to 8.","Finalise D (8). E improves from 12 to 10."],key:1,simple:"A tentative distance is only an offer. A node's value becomes final when it's the smallest one left, because every other route would have to go through something at least as large. Negative edges break this argument.",wrong:"Always take the smallest unfinished distance, then relax.",
      video:{title:"Dijkstra's algorithm, step by step",ts:"08:12",why:"You've missed this concept twice. This segment traces the priority queue line by line."}}

      {q:"In the drag law F = −kv², the dimensions of k are:",o:["M L⁻¹","M T⁻¹","M L T⁻²","M L⁻¹ T"],a:0,why:"[k] = [F]/[v²] = (M L T⁻²) / (L² T⁻²) = M L⁻¹."},
      {q:"10 repeated measurements have a standard deviation of 0.20 s. The uncertainty of their mean is:",o:["0.20 s","0.063 s","0.020 s","0.14 s"],a:1,why:"σ/√n = 0.20/√10 ≈ 0.063 s."},
      {q:"x = 100.0 ± 0.5 and y = 98.0 ± 0.5. The relative uncertainty on z = x − y is:",o:["1%","0.5%","25%","50%"],a:3,why:"z = 2.0 ± 1.0, so 50%. For a difference, absolute uncertainties add. Subtracting close values is a trap in lab work."}],

      {q:"r(t) = (2t, t²) in SI units. The radius of curvature at t = 1 s is:",o:["2.83 m","5.66 m","4.00 m","1.41 m"],a:1,why:"v = (2, 2), so v² = 8. a = (0, 2) and a_n = |v × a|/|v| = 4/2.83 = 1.41. ρ = v²/a_n = 5.66 m."},
      {q:"A particle decelerates with a = −kv, where k = 2.0 s⁻¹ and v₀ = 10 m/s. Its total stopping distance is:",o:["5.0 m","10 m","20 m","Infinite"],a:0,why:"dv/dx = −k, so v = v₀ − kx. It stops at x = v₀/k = 5.0 m, even though stopping takes infinite time."},
      {q:"A boat moves at 4.0 m/s relative to the water. It crosses straight over a river 120 m wide, with a 3.0 m/s current. The crossing takes:",o:["30 s","24 s","45 s","40 s"],a:2,why:"To go straight across, it must cancel the current. Net speed = √(16 − 9) = 2.65 m/s, so t = 120 / 2.65 ≈ 45 s."},

      {q:"A curve has R = 100 m and is designed for 20 m/s with no friction needed. The banking angle is:",o:["11.5°","22.2°","24.1°","67.8°"],a:1,why:"tan θ = v²/(Rg) = 400 / 980 = 0.408, so θ ≈ 22.2°."},

      {q:"A 2.0 kg block falls 0.50 m onto a spring with k = 500 N/m. The maximum compression is:",o:["0.198 m","0.241 m","0.141 m","0.313 m"],a:1,why:"Energy: mg(h + x) = ½kx², so 250x² − 19.6x − 9.8 = 0 and x ≈ 0.241 m. Gravity keeps doing work during the compression."},
      {q:"The Moon orbits at r = 3.84 × 10⁸ m with T = 27.3 days. These data give Earth's mass as about:",o:["6.0 × 10²⁴ kg","6.0 × 10²² kg","2.0 × 10³⁰ kg","7.3 × 10²² kg"],a:0,why:"M = 4π²r³/(GT²) ≈ 6.0 × 10²⁴ kg. The Moon's own mass cancels, so it can't be found this way."},

      {q:"Assuming a uniform Earth, the value of g at a depth of R/2 below the surface is about:",o:["2.45 m/s²","4.9 m/s²","9.8 m/s²","19.6 m/s²"],a:1,why:"By Gauss's theorem, only the enclosed mass counts, so inside a uniform sphere g grows linearly with r. At R/2 it's g₀/2."},
      {q:"A geostationary satellite has T = 86 164 s. With GM = 3.986 × 10¹⁴ m³/s² and R = 6371 km, its height above the surface is:",o:["3.58 × 10⁴ km","4.22 × 10⁴ km","6.65 × 10³ km","2.02 × 10⁴ km"],a:0,why:"r³ = GMT²/4π² gives r = 42 164 km from the centre. Subtract R to get about 35 800 km."}],
    many:[
      {q:"A 2.0 kg cart at 3.0 m/s collides elastically head-on with a 1.0 kg cart at rest. Their speeds afterwards are:",o:["1.0 and 4.0 m/s","2.0 and 2.0 m/s","0 and 3.0 m/s","1.5 and 3.0 m/s"],a:0,why:"v₁ = (m₁ − m₂)/(m₁ + m₂) v = 1.0 m/s and v₂ = 2m₁/(m₁ + m₂) v = 4.0 m/s. Check: momentum is 6 and KE is 9 J, both before and after."},
      {q:"A 70 kg person walks 4.0 m along a 30 kg boat at rest on still water. The boat moves:",o:["1.2 m","2.8 m","4.0 m","0 m"],a:1,why:"With no external horizontal force, the centre of mass stays put. So Δx_boat = (70/100) × 4.0 = 2.8 m the other way."},
      {q:"A 1.0 kg mass at 4.0 m/s (east) sticks to a 2.0 kg mass at 3.0 m/s (north). The final speed is:",o:["2.40 m/s","3.33 m/s","7.21 m/s","5.0 m/s"],a:0,why:"Momentum is a vector: p = (4, 6) kg·m/s, so |p| = 7.21 and v = 7.21 / 3.0 ≈ 2.40 m/s."},
      {q:"A 0.15 kg ball arrives at 40 m/s and leaves in the opposite direction at 40 m/s, after 10 ms of contact. The mean force is:",o:["600 N","1200 N","12 N","6 N"],a:1,why:"Δp = 0.15 × 80 = 12 kg·m/s, because the direction reverses. F = 12 / 0.010 = 1200 N."},
      {q:"A 2.0 kg cart at 3.0 m/s approaches a 1.0 kg cart at rest. By König's theorem, the kinetic energy in the centre of mass frame is:",o:["9 J","6 J","3 J","0 J"],a:2,why:"v_cm = 2.0 m/s, so K_cm = ½ × 3.0 × 2.0² = 6 J. K' = 9 − 6 = 3 J. That's the most a collision can dissipate."}],
    thermo1:[
      {q:"1.0 mol of ideal gas doubles its volume reversibly and isothermally at 300 K. It absorbs:",o:["1.73 kJ","2.49 kJ","3.74 kJ","0 kJ"],a:0,why:"ΔU = 0, so Q = W = nRT ln 2 = 8.314 × 300 × 0.693 ≈ 1.73 kJ."},
      {q:"200 g of aluminium (c = 900 J/kg·K) at 100 °C goes into 500 g of water at 20 °C. The final temperature is about:",o:["26.3 °C","32.0 °C","60.0 °C","22.5 °C"],a:0,why:"Heat lost = heat gained: T = (180 × 100 + 2093 × 20) / (180 + 2093) ≈ 26.3 °C. Water's huge heat capacity dominates."},
      {q:"1.0 mol of monatomic gas is heated at constant pressure from 300 K to 600 K. The fraction of Q turned into work is:",o:["40%","60%","100%","0%"],a:0,why:"Q = 2.5 nRΔT and W = nRΔT, so W/Q = 40%. The other 60% raises the internal energy."},
      {q:"The rms speed of N₂ molecules (M = 28 g/mol) at 300 K is about:",o:["165 m/s","517 m/s","298 m/s","1490 m/s"],a:1,why:"v = √(3RT/M) = √(3 × 8.314 × 300 / 0.028) ≈ 517 m/s. M must be in kg/mol."},
      {q:"A diatomic ideal gas has Cv = 5R/2. By Mayer's relation, Cp is about:",o:["12.5 J/mol·K","20.8 J/mol·K","29.1 J/mol·K","37.4 J/mol·K"],a:2,why:"Cp = Cv + R = 7R/2 = 29.1 J/mol·K."}],
    fluids:[
      {q:"A tank is filled to 5.0 m. A hole sits 1.0 m above the ground. How far horizontally does the water land?",o:["2.0 m","4.0 m","4.5 m","8.9 m"],a:1,why:"v = √(2g × 4.0) = 8.85 m/s and fall time = √(2 × 1.0/g) = 0.452 s, so x = 4.0 m. In general, x = 2√(h·y)."},
      {q:"Ice (ρ = 917 kg/m³) floats in seawater (ρ = 1025 kg/m³). The fraction submerged is:",o:["10.5%","89.5%","91.7%","100%"],a:1,why:"Weight = buoyancy, so V_sub/V = 917/1025 ≈ 89.5%."},
      {q:"An object weighs 10.0 N in air and 8.0 N when fully immersed in water. Its density is:",o:["1250 kg/m³","2000 kg/m³","5000 kg/m³","8000 kg/m³"],a:2,why:"Buoyancy is 2.0 N = ρ_w g V. So ρ/ρ_w = 10.0/2.0 = 5, which gives 5000 kg/m³."},
      {q:"In laminar viscous flow at a fixed pressure drop, the pipe's radius is halved. The flow rate becomes:",o:["1/2","1/4","1/8","1/16"],a:3,why:"Poiseuille: Q ∝ r⁴, so (1/2)⁴ = 1/16. That's why small narrowings matter so much."},
      {q:"In a hydraulic press, a 100 N force acts on a 2.0 cm² piston. The other piston is 50 cm². The force it delivers is:",o:["4 N","250 N","2500 N","5000 N"],a:2,why:"Pascal: pressure is the same on both, so F₂ = F₁ × A₂/A₁ = 100 × 25 = 2500 N."}],
    rot:[
      {q:"The minimum μs that lets a solid cylinder roll without slipping down a 30° slope is:",o:["0.58","0.19","0.29","0.14"],a:1,why:"f = ⅓ mg sin θ and N = mg cos θ, so μs ≥ ⅓ tan θ ≈ 0.19."},
      {q:"Masses of 3.0 kg and 1.0 kg hang over a pulley that's a uniform disk of mass 2.0 kg. The acceleration is:",o:["4.90 m/s²","3.92 m/s²","3.27 m/s²","2.45 m/s²"],a:1,why:"a = (m₁ − m₂)g / (m₁ + m₂ + M/2) = 19.6 / 5.0 = 3.92 m/s². The disk adds only M/2, from I = ½MR²."},
      {q:"A uniform 1.0 m rod is pivoted at one end and released from horizontal. The tip's speed at the bottom is:",o:["3.13 m/s","4.43 m/s","5.42 m/s","6.26 m/s"],a:2,why:"mg(L/2) = ½(⅓mL²)ω², so v = ωL = √(3gL) ≈ 5.42 m/s. The tip beats free fall (4.43 m/s)."},
      {q:"A skater spins with I = 3.0 kg·m² at 2.0 rad/s, then pulls in to I = 1.0 kg·m². Their kinetic energy goes up by a factor of:",o:["1","3","6","9"],a:1,why:"L is conserved, so ω = 6.0 rad/s. KE goes from 6.0 J to 18 J, a factor of 3. The extra energy is the work done by the arms."},
      {q:"A 4.0 m, 20 kg uniform beam rests on supports at its ends. A 60 kg person stands 1.0 m from the left end. The right support pushes with:",o:["245 N","392 N","539 N","784 N"],a:0,why:"Torques about the left end: R × 4.0 = (20 × 2.0 + 60 × 1.0) g, so R = 25 g = 245 N. The left support carries 539 N."}],
    thermo2:[
      {q:"An ideal refrigerator extracts 1000 J at −10 °C and rejects heat at 20 °C. The work needed is:",o:["114 J","500 J","3000 J","87 J"],a:0,why:"COP = Tc/(Th − Tc) = 263/30 = 8.77, so W = 1000 / 8.77 ≈ 114 J. Kelvin only."},
      {q:"2.0 mol of ideal gas triples its volume reversibly and isothermally. Its ΔS is:",o:["9.1 J/K","18.3 J/K","49.9 J/K","0 J/K"],a:1,why:"ΔS = nR ln(V₂/V₁) = 2 × 8.314 × ln 3 ≈ 18.3 J/K."},
      {q:"An ideal Otto cycle has a compression ratio of 8 and γ = 1.4. Its efficiency is:",o:["87.5%","56.5%","43.5%","71.4%"],a:1,why:"η = 1 − r^(1−γ) = 1 − 8^(−0.4) ≈ 56.5%."},
      {q:"100 g of ice melts reversibly at 0 °C (L = 334 kJ/kg). Its entropy change is:",o:["+122 J/K","+334 J/K","−122 J/K","0 J/K"],a:0,why:"ΔS = Q/T = 33 400 J / 273.15 K ≈ +122 J/K. Temperature is constant here, so no logarithm."},
      {q:"A reversible engine absorbs 1000 J at 500 K and rejects heat at 300 K. By Clausius' theorem, the heat rejected is:",o:["400 J","600 J","1000 J","167 J"],a:1,why:"For a reversible cycle, ΣQ/T = 0: 1000/500 = Q_c/300, so Q_c = 600 J."}],
    c:[
      {q:"In C, what does 7 / 2 evaluate to, with int operands?",o:["3.5","3","4","Compile error"],a:1,why:"Integer division truncates."},
      {q:"char s[] = \"ciao\"; What is sizeof(s)?",o:["4","5","8","1"],a:1,why:"Four characters plus the terminator \\0."},
      {q:"int x = 5; int y = x++; What is y?",o:["5","6","4","Undefined"],a:0,why:"Post-increment returns the old value, then increments x."},
      {q:"An array passed to a function is received as:",o:["A full copy","A pointer to its first element","Its length","A struct"],a:1,why:"The array decays to a pointer, so the function can change the original."}],
    analysis:[
      {q:"f(n) = 3n² + 10n is:",o:["Θ(n)","Θ(n log n)","Θ(n²)","Θ(n³)"],a:2,why:"The dominant term decides, and constants are dropped."},
      {q:"T(n) = 2T(n/2) + n solves to:",o:["O(n)","O(n log n)","O(n²)","O(log n)"],a:1,why:"log n levels with n work on each."},
      {q:"T(n) = T(n − 1) + n solves to:",o:["O(n)","O(n log n)","O(n²)","O(2ⁿ)"],a:2,why:"n + (n−1) + … + 1 = n(n+1)/2."},
      {q:"Which statement is true?",o:["n log n is O(n)","n² is O(n log n)","n log n is O(n²)","2ⁿ is O(n²)"],a:2,why:"O is an upper bound, and n² grows faster than n log n."}],
    data:[
      {q:"Inserting at the head of a singly linked list costs:",o:["O(1)","O(log n)","O(n)","O(n²)"],a:0,why:"Only one new node and two pointer updates."},
      {q:"A function returns the address of its local variable. The result is:",o:["Safe","A memory leak","A dangling pointer","A double free"],a:2,why:"The local lives on the stack and its frame is gone after the return."},
      {q:"What happens if you read *p after free(p)?",o:["It returns 0","Undefined behaviour","Compile error","It reallocates"],a:1,why:"The memory no longer belongs to you."},
      {q:"For int *p, *(p + 2) is the same as:",o:["p + 2","p[2]","&p[2]","*p + 2"],a:1,why:"Pointer arithmetic scales by the element size, and that's what indexing means."}],
    sort:[
      {q:"Mergesort's worst-case running time is:",o:["O(n)","O(n log n)","O(n²)","O(log n)"],a:1,why:"It always splits evenly, with linear merging at each level."},
      {q:"Which of these is stable in its usual implementation?",o:["Insertion sort","Quicksort","Heapsort","Selection sort"],a:0,why:"It never moves an element past an equal one."},
      {q:"Insertion sort on already sorted input takes:",o:["O(1)","O(n)","O(n log n)","O(n²)"],a:1,why:"Each element needs just one comparison."},
      {q:"Counting sort can beat O(n log n) because it:",o:["Uses recursion","Doesn't compare elements","Is unstable","Uses a heap"],a:1,why:"The n log n bound only applies to comparison sorts. It runs in O(n + k)."}],
    rec:[
      {q:"A recursive function has no reachable base case. At runtime you get:",o:["Stack overflow","A memory leak","Faster code","A compile error"],a:0,why:"Frames pile up until the stack runs out."},
      {q:"f(n) = f(n − 1) + f(n − 2) without memoisation runs in:",o:["O(n)","O(n log n)","O(n²)","Exponential time"],a:3,why:"The same subproblems are recomputed across a growing call tree."},
      {q:"Where are the frames of recursive calls stored?",o:["The heap","The stack","Static memory","The file system"],a:1,why:"Each call pushes a frame on the call stack."},
      {q:"Pruning in backtracking means:",o:["Sorting the input","Abandoning branches that can't lead to a solution","Freeing memory","Removing recursion"],a:1,why:"Cutting those branches early shrinks the explored state space."}],
    mod:[
      {q:"A C header file should normally contain:",o:["The public declarations","All function bodies","The main function","Local variables"],a:0,why:"It's the interface that clients include."},
      {q:"make decides what to rebuild by comparing:",o:["File sizes","File timestamps and dependencies","Function names","Line counts"],a:1,why:"A target is rebuilt if a dependency is newer."},
      {q:"In gdb, a breakpoint:",o:["Stops execution at a chosen point","Deletes a line","Fixes a bug","Recompiles the code"],a:0,why:"You can then inspect variables and step through the code."},
      {q:"In the interface-implementation-client model, a client includes:",o:["Only the .h","The .c file","The object file","Nothing"],a:0,why:"It should depend only on the interface."}],
    disc:[
      {q:"A tree with n nodes has how many edges?",o:["n","n − 1","n + 1","2n"],a:1,why:"Each node apart from the root has exactly one parent edge."},
      {q:"A relation that's reflexive, symmetric and transitive is:",o:["A function","An order","An equivalence","A graph"],a:2,why:"That's the definition of an equivalence relation."},
      {q:"An undirected graph has 6 edges. What's the sum of its vertex degrees?",o:["6","12","18","36"],a:1,why:"Each edge adds 2 to the sum."},
      {q:"A complete binary tree of height 3 has how many leaves?",o:["3","6","8","16"],a:2,why:"2³ = 8."}],
    dp:[
      {q:"Dynamic programming applies when a problem has:",o:["Sorted input","Optimal substructure and overlapping subproblems","Only greedy choices","Independent subproblems only"],a:1,why:"The repeats are what make storing answers worthwhile."},
      {q:"Compared with DP, divide and conquer typically has subproblems that are:",o:["Independent","Overlapping","Always greedy","Unsolvable"],a:0,why:"That's why mergesort doesn't need a table."},
      {q:"The optimal greedy rule for activity selection is to pick the activity with the:",o:["Earliest start","Earliest finish","Shortest duration","Latest start"],a:1,why:"Finishing earliest leaves the most room for the others."},
      {q:"The LCS table for strings of lengths m and n has how many cells?",o:["m + n","O(mn)","O(2ⁿ)","O(log mn)"],a:1,why:"One cell for each pair of prefixes."}],
    adt:[
      {q:"A FIFO queue returns elements in which order?",o:["Reverse of insertion","Order of insertion","Sorted order","Random order"],a:1,why:"First in, first out."},
      {q:"Inserting into a binary heap with n elements costs:",o:["O(1)","O(log n)","O(n)","O(n log n)"],a:1,why:"The new key rises at most the height of the tree."},
      {q:"In a 0-based array heap, the children of node i are at:",o:["2i and 2i + 1","2i + 1 and 2i + 2","i + 1 and i + 2","i/2 and i/2 + 1"],a:1,why:"With a 0-based array, the root's children are at 1 and 2."},
      {q:"In a min-heap, the smallest key is:",o:["At the root","At a leaf","In the middle","Anywhere"],a:0,why:"Each parent is at most as large as its children."}],
    problem:[
      {q:"You're looking for the best visiting order of 8 cities. Which model fits?",o:["Powerset","Permutations","Combinations","Single loop"],a:1,why:"Order matters and no city repeats."},
      {q:"How many ways are there to choose 3 items from 5, if order doesn't matter?",o:["10","15","60","125"],a:0,why:"C(5,3) = 5! / (3! 2!) = 10."},
      {q:"Pruning a search generally:",o:["Reduces explored cases, while the worst case can stay exponential","Guarantees polynomial time","Makes results approximate","Needs a sorted input"],a:0,why:"It helps in practice, but doesn't change the worst-case class."},
      {q:"A greedy algorithm is justified when:",o:["It's easiest to code","The greedy choice property can be proved","The input is small","DP is too slow"],a:1,why:"Without a proof, greedy can return a non-optimal answer."}],
    symbol:[
      {q:"An inorder visit of a BST returns the keys:",o:["In sorted order","In insertion order","In reverse insertion order","Randomly"],a:0,why:"Left subtree, node, then right subtree."},
      {q:"A hash table with chaining has 30 keys in 10 buckets. What's the average chain length?",o:["0.33","3","10","30"],a:1,why:"The load factor is α = n/m = 3."},
      {q:"Two different keys land in the same hash bucket. This is called:",o:["A collision","An overflow","A rotation","A leak"],a:0,why:"Chaining and open addressing are two ways to handle it."},
      {q:"To delete a BST node with two children, you typically replace it with its:",o:["Parent","Inorder successor or predecessor","Root","Left child, always"],a:1,why:"This preserves the BST ordering."}],
    graphs:[
      {q:"Which visit gives the fewest edges to each node in an unweighted graph?",o:["BFS","DFS","Either one","Neither"],a:0,why:"BFS explores level by level."},
      {q:"In a DFS of a directed graph, a back edge means:",o:["There's a cycle","The graph is a tree","The graph is disconnected","The graph is weighted"],a:0,why:"It leads to an ancestor on the current path."},
      {q:"Adjacency lists use how much memory?",o:["Θ(V)","Θ(E)","Θ(V + E)","Θ(V²)"],a:2,why:"One list per vertex, plus an entry for each edge."},
      {q:"A minimum spanning tree of a connected graph with V vertices has:",o:["V edges","V − 1 edges","E edges","V² edges"],a:1,why:"It's a tree, so it has V − 1 edges."}]
  },
  fixes:{
    in1:"Quick clarification: averaging reduces statistical uncertainty, but not systematic error.\n\nExample: a ruler with a worn end shifts every reading by 1 mm. 100 repeats won't remove it, while calibration will.",
    ki1:"Quick clarification: tangential and normal acceleration are perpendicular vectors. The angle between a and v depends on their ratio.\n\nExample: R = 4.0 m and a_t = 2.0 m/s². 45° needs a_n = a_t, so v² = 8.0 m²/s² and t = 1.41 s.",
    nw1:"Quick clarification: friction doesn't follow the motion, it opposes the sliding between the two surfaces. If a block slides down a slope, friction points up the slope.\n\nExample: m₁ = 4.0 kg on a 30° slope (μ = 0.20), pulling up m₂ = 1.0 kg. f = 6.79 N acts up the slope, and a = (19.6 − 6.79 − 9.8) / 5.0 = 0.60 m/s². Sanity check: with no friction a = 1.96 m/s². Friction must make it smaller, so if you got more than 1.96, your arrow points the wrong way.",
    nw2:"Quick clarification: N = mg holds only on a flat surface with no other vertical forces. On an incline the surface carries only the perpendicular part of the weight: N = mg cos θ.\n\nExample: 1 kg at 30°. N = 9.8 × 0.866 ≈ 8.5 N, not 9.8 N. So friction is μN = 0.2 × 8.5 ≈ 1.70 N.",
    nw3:"Quick clarification: don't memorise sin vs cos, test the limit. On a flat surface (θ = 0) the pull along the slope must be 0, and sin 0 = 0. So along the slope is mg sin θ and into the slope is mg cos θ.\n\nExample: at 30°, along = 0.50 mg, into = 0.87 mg.",
    gv1:"Quick clarification: in g = GM/r², r is measured from the centre of the planet, not the surface.\n\nExample: at height R, r = 2R, so g falls by 4 to 2.45 m/s².",
    gv2:"Quick clarification: inside a uniform sphere, only the mass enclosed within radius r contributes, by Gauss's theorem.\n\nExample: at r = R/2, the field is half its surface value, since it grows linearly with r.",
    mo1:"Quick clarification: in a sticking collision momentum is conserved, but kinetic energy isn't. Use momentum for the impact, and energy only for the motion after it.\n\nExample: ballistic pendulum, m = 10 g, M = 2.00 kg, h = 5.0 cm. V = √(2gh) = 0.99 m/s, then v = 201 × V ≈ 199 m/s. Using energy across the impact wrongly gives 14 m/s.",
    mo2:"Quick clarification: after objects stick, use the combined mass.\n\nExample: for the ballistic pendulum, mv = (M + m)V, so v = (2.01 / 0.010) V, not (2.00 / 0.010) V.",
    th1:"Quick clarification: with W as the work done BY the gas, the First Law is ΔU = Q − W.\n\nExample: the gas absorbs 500 J and does 200 J of work. ΔU = 500 − 200 = 300 J.",
    th2:"Quick clarification: ΔU = nCvΔT in every process for an ideal gas, even one that isn't at constant volume. Cp only gives the heat at constant pressure.\n\nExample: 2.0 mol adiabatic, 400 K to 252 K: W = −ΔU = 2.0 × 12.47 × 148 ≈ 3.69 kJ. Using Cp wrongly gives 6.15 kJ.",
    fl1:"Quick clarification: in steady horizontal flow, faster fluid has lower pressure. That's Bernoulli: P + ½ρv² stays constant.\n\nExample: in a narrowing pipe, speed goes up and the pressure in the narrow section goes down.",
    ro1:"Quick clarification: I depends on shape. A hoop has I = MR², a solid cylinder has I = ½MR², since its mass sits closer to the axis.\n\nExample: rolling 2.0 m down a 30° slope, a solid cylinder reaches 3.61 m/s, and a hoop only 3.13 m/s.",
    ro2:"Quick clarification: the same force can produce different torques. Torque is τ = rF sin φ, so the lever arm matters. Then use τ = Iα for the rotation.\n\nExample: F = 4 N at r = 0.5 m applied tangentially gives τ = 2 N·m.",
    ro3:"Quick clarification: a rolling body stores energy in both translation and rotation, so it gains speed more slowly than a frictionless sliding block.\n\nExample: a rolling solid cylinder has KE = ½mv² + ¼mv² = ¾mv².",
    tt1:"Quick clarification: entropy and Carnot formulas need absolute temperatures, so always convert to kelvin first.\n\nExample: mixing 1 kg at 80 °C with 1 kg at 20 °C: ΔS = 4186 × [ln(323/353) + ln(323/293)] ≈ +36 J/K. With Celsius you'd wrongly get 1868 J/K.",
    tt2:"Quick clarification: the entropy of one part can fall. It's the total for an isolated system that can't decrease.\n\nExample: water cooling in a fridge loses entropy, and the room gains more.",
    cc1:"Quick clarification: dividing two ints truncates, and x++ returns the old value.\n\nExample: 7 / 2 is 3, while 7.0 / 2 is 3.5. With x = 5, y = x++ gives y = 5 and x = 6.",
    an1:"Quick clarification: to solve a recurrence, unroll it. Count the levels, then multiply by the work per level.\n\nExample: T(n) = T(n/2) + 1 has log₂n levels with cost 1, so it's O(log n).",
    ds1:"Quick clarification: if you overwrite the only pointer to a block, you can no longer free it. Keep the pointer until you call free.\n\nExample: wrong: p = malloc(...); p = NULL; Right: p = malloc(...); free(p); p = NULL;",
    ds2:"Quick clarification: local variables disappear when the function returns, so never return their address. Allocate with malloc or use a parameter from the caller.\n\nExample: int v[10]; return v; is wrong. int *v = malloc(10 * sizeof(int)); return v; is right.",
    so1:"Quick clarification: O(n log n) is quicksort's average case and needs balanced partitions. A bad pivot makes it O(n²).\n\nExample: sorted input with a first-element pivot leaves n − 1 elements on one side at each step.",
    re1:"Quick clarification: with a shared array, undo each choice after the recursive call returns. Otherwise it leaks into the next branch.\n\nExample: sol[k] = 1; solve(k + 1); sol[k] = 0; solve(k + 1);",
    re2:"Quick clarification: every recursive function needs a case that returns without recursing, and each call must move toward it.\n\nExample: if (n == 0) return 0; handles the smallest input before the recursive call.",
    md1:"Quick clarification: define the struct in the .c and expose only a pointer type in the .h. That way clients can't depend on its fields.\n\nExample: typedef struct list *List; goes in list.h, and struct list { ... }; goes in list.c.",
    dm1:"Quick clarification: in an undirected graph, A-B and B-A are the same edge, so divide by 2.\n\nExample: a complete graph on 5 vertices has 5 × 4 / 2 = 10 edges.",
    dp1:"Quick clarification: plain recursion is correct, but it solves the same subproblem many times. DP stores each answer once.\n\nExample: for coins {1, 3, 4}, the amount 2 is reached through many paths from amount 6. Recursion recomputes it each time, while dp[2] is calculated once and looked up. Cost falls from exponential to O(amount × coins).",
    dp2:"Quick clarification: for amounts 0 to A, the table has A + 1 cells, and dp[0] = 0. Every transition must add 1 for the coin it uses.\n\nExample: dp[a] = 1 + min(dp[a − c]). Without the + 1, the entire table stays 0.",
    dp3:"Quick clarification: biggest-coin-first isn't always optimal, because a large first coin can force many small coins later. DP compares every option.\n\nExample: coins {1, 3, 4}, amount 6. Greedy gives 4 + 1 + 1 = 3 coins. DP finds 3 + 3 = 2 coins.",
    ad1:"Quick clarification: a stack is last-in, first-out, and a FIFO queue is first-in, first-out.\n\nExample: insert 1, 2, 3. A stack removes 3 first, and a queue removes 1 first.",
    ad2:"Quick clarification: in a 0-based array heap, the children of i are at 2i + 1 and 2i + 2, and the parent is at (i − 1) / 2.\n\nExample: node 1 has children at 3 and 4.",
    gr1:"Quick clarification: a tentative distance can still improve. A node is final only when it's the smallest one remaining.\n\nExample: A–B = 4, A–C = 2, B–C = 1. B starts at 4, but C is taken first, and B improves to 3.",
    gr2:"Quick clarification: DFS visits every node, but not in order of distance. In unweighted graphs, BFS gives the fewest edges.\n\nExample: DFS may reach a neighbour through a five-edge detour. BFS finds it at distance 1 first.",
    gr3:"Quick clarification: Dijkstra assumes finalised distances can't improve, and a negative edge breaks this. Use Bellman-Ford for negative weights.\n\nExample: a −2 edge could make an already finalised node cheaper later, and Dijkstra would never revisit it.",
    ps1:"Quick clarification: pick the model by asking whether order matters and whether items repeat.\n\nExample: selecting a subset of 20 items gives 2²⁰ cases. Ordering 20 items gives 20!, which is vastly larger.",
